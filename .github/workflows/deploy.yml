name: Deploy to Vercel (Production)

# Why this exists:
# A single GitHub account can only be linked to ONE Vercel account. This repo's
# GitHub identity is claimed by a *work* Vercel account that isn't a member of
# the personal team that owns this project, so Vercel's native Git integration
# blocks every push ("commit author not authorized"). This workflow deploys with
# a personal-account *token* instead, which authenticates directly as a team
# member and bypasses the GitHub-identity gate entirely.
#
# Setup (one-time): add a repo secret VERCEL_TOKEN
#   - Create it at https://vercel.com/account/tokens while signed into the
#     PERSONAL account (elliothimmelfarb), scoped to the team
#     "elliothimmelfarb's projects".
#   - Add it under GitHub repo -> Settings -> Secrets and variables -> Actions.
# The org/project IDs below are identifiers, not secrets (they appear in deploy
# URLs and .vercel/project.json), so they're inlined to keep setup to one secret.

on:
  push:
    branches: [main]

# Never let two production deploys race; newest push wins.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_u2t06USZwJkyI5Dy4ootPZQv
      VERCEL_PROJECT_ID: prj_pM8BkrVgP5YwE5Kq9BXmuORH1tzZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (match Vercel production runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
