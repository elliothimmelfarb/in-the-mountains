<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Georgia, serif">
  <rect width="980" height="560" fill="#14110d"/>
  <text x="34" y="42" fill="#e9e0cf" font-size="25" font-weight="bold">On-station dwell: what the game codes vs. what it really takes</text>
  <text x="34" y="68" fill="#a99" font-size="14">Coded dwell is GAME-time; at the default 4× the player watches it pass in the “on screen” figure. Time axis is logarithmic.</text>

  <!-- log time axis: x(s) = 250 + (log10 s - log10 60) * 189.97 -->
  <g stroke="#3a352b" stroke-width="1">
    <line x1="250" y1="92" x2="250" y2="486"/>
    <line x1="383" y1="92" x2="383" y2="486"/>
    <line x1="497" y1="92" x2="497" y2="486"/>
    <line x1="588" y1="92" x2="588" y2="486"/>
    <line x1="702" y1="92" x2="702" y2="486"/>
    <line x1="850" y1="92" x2="850" y2="486"/>
  </g>
  <g fill="#8a8475" font-size="12" text-anchor="middle">
    <text x="250" y="86">1 min</text>
    <text x="383" y="86">5 min</text>
    <text x="497" y="86">20 min</text>
    <text x="588" y="86">1 hr</text>
    <text x="702" y="86">4 hr</text>
    <text x="850" y="86">24 hr</text>
  </g>

  <!-- rows -->
  <g>
    <!-- CENSUS 300s -> 383 ; band 14400..36000 -> 702..778 -->
    <g transform="translate(0,126)">
      <text x="240" y="5" fill="#d8cdb6" font-size="15" text-anchor="end">Census / cordon-search</text>
      <rect x="702" y="-11" width="76" height="22" rx="3" fill="#2f5d34"/>
      <text x="740" y="4" fill="#cdeccf" font-size="11" text-anchor="middle">4–10 h</text>
      <line x1="391" y1="0" x2="694" y2="0" stroke="#5a4a40" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="383" cy="0" r="8" fill="#d24b3a"/>
      <text x="383" y="-16" fill="#e6a59a" font-size="11" text-anchor="middle">300 s</text>
      <text x="383" y="22" fill="#7d756a" font-size="10" text-anchor="middle">75 s on screen</text>
      <text x="946" y="4" fill="#d24b3a" font-size="14" text-anchor="end" font-weight="bold">~70×</text>
    </g>
    <!-- KLE 360s -> 398 ; band 3600..10800 -> 588..678 -->
    <g transform="translate(0,182)">
      <text x="240" y="5" fill="#d8cdb6" font-size="15" text-anchor="end">KLE / shura</text>
      <rect x="588" y="-11" width="90" height="22" rx="3" fill="#2f5d34"/>
      <text x="633" y="4" fill="#cdeccf" font-size="11" text-anchor="middle">1–3 h</text>
      <line x1="406" y1="0" x2="580" y2="0" stroke="#5a4a40" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="398" cy="0" r="8" fill="#d24b3a"/>
      <text x="398" y="-16" fill="#e6a59a" font-size="11" text-anchor="middle">360 s</text>
      <text x="946" y="4" fill="#d24b3a" font-size="14" text-anchor="end" font-weight="bold">~20×</text>
    </g>
    <!-- OP 900s -> 473 ; band 10800..28800 -> 678..759 -->
    <g transform="translate(0,238)">
      <text x="240" y="5" fill="#d8cdb6" font-size="15" text-anchor="end">Establish OP / overwatch</text>
      <rect x="678" y="-11" width="81" height="22" rx="3" fill="#2f5d34"/>
      <text x="718" y="4" fill="#cdeccf" font-size="11" text-anchor="middle">3–8 h</text>
      <line x1="481" y1="0" x2="670" y2="0" stroke="#5a4a40" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="473" cy="0" r="8" fill="#d24b3a"/>
      <text x="473" y="-16" fill="#e6a59a" font-size="11" text-anchor="middle">900 s</text>
      <text x="946" y="4" fill="#d24b3a" font-size="14" text-anchor="end" font-weight="bold">~20×</text>
    </g>
    <!-- AMBUSH 1100s -> 490 ; band 7200..28800 -> 645..759 -->
    <g transform="translate(0,294)">
      <text x="240" y="5" fill="#d8cdb6" font-size="15" text-anchor="end">Ambush / interdiction</text>
      <rect x="645" y="-11" width="114" height="22" rx="3" fill="#2f5d34"/>
      <text x="702" y="4" fill="#cdeccf" font-size="11" text-anchor="middle">hours (8 h rotate)</text>
      <line x1="498" y1="0" x2="637" y2="0" stroke="#5a4a40" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="490" cy="0" r="8" fill="#d24b3a"/>
      <text x="490" y="-16" fill="#e6a59a" font-size="11" text-anchor="middle">1100 s</text>
      <text x="946" y="4" fill="#d24b3a" font-size="14" text-anchor="end" font-weight="bold">~13×</text>
    </g>
    <!-- RECON 150s -> 326 ; band 3600..14400 -> 588..702 -->
    <g transform="translate(0,350)">
      <text x="240" y="5" fill="#d8cdb6" font-size="15" text-anchor="end">Reconnaissance</text>
      <rect x="588" y="-11" width="114" height="22" rx="3" fill="#2f5d34"/>
      <text x="645" y="4" fill="#cdeccf" font-size="11" text-anchor="middle">≥ 1 h</text>
      <line x1="334" y1="0" x2="580" y2="0" stroke="#5a4a40" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="326" cy="0" r="8" fill="#d24b3a"/>
      <text x="326" y="-16" fill="#e6a59a" font-size="11" text-anchor="middle">150 s</text>
      <text x="946" y="4" fill="#d24b3a" font-size="14" text-anchor="end" font-weight="bold">~36×</text>
    </g>
    <!-- PRESENCE 180s -> 341 ; band 3600..21600 -> 588..736 -->
    <g transform="translate(0,406)">
      <text x="240" y="5" fill="#d8cdb6" font-size="15" text-anchor="end">Presence patrol (default)</text>
      <rect x="588" y="-11" width="148" height="22" rx="3" fill="#2f5d34"/>
      <text x="662" y="4" fill="#cdeccf" font-size="11" text-anchor="middle">hours · 3×/day cadence</text>
      <line x1="349" y1="0" x2="580" y2="0" stroke="#5a4a40" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="341" cy="0" r="8" fill="#d24b3a"/>
      <text x="341" y="-16" fill="#e6a59a" font-size="11" text-anchor="middle">180 s</text>
      <text x="946" y="4" fill="#d24b3a" font-size="14" text-anchor="end" font-weight="bold">~60×</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(34,500)">
    <circle cx="8" cy="0" r="8" fill="#d24b3a"/><text x="24" y="5" fill="#cabfa9" font-size="13">coded game dwell (helpers.ts → dwellFor)</text>
    <rect x="300" y="-9" width="26" height="18" rx="3" fill="#2f5d34"/><text x="334" y="5" fill="#cabfa9" font-size="13">realistic duration — doctrine + first-hand accounts</text>
  </g>
  <text x="34" y="540" fill="#6f6a5e" font-size="11.5">Sources: FM 3-06.11 (cordon-search is half-to-full-day); CALL Biometrics guide (≤30 min/person enrollment); FM 7-8 / ATP 3-21.8 (patrol-base 24 h cap; ambush 8 h rotation).</text>
</svg>
