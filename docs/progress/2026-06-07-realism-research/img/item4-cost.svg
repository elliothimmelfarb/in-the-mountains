<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Georgia, serif">
  <rect width="980" height="620" fill="#14110d"/>
  <text x="34" y="40" fill="#e9e0cf" font-size="23" font-weight="bold">Why squads ring the spur: an isotropic cost surface can’t switchback</text>

  <!-- ===================== LEFT: current (isotropic) ===================== -->
  <g transform="translate(0,0)">
    <text x="40" y="78" fill="#e0a39a" font-size="18" font-weight="bold">NOW · isotropic per-cell cost</text>
    <text x="40" y="100" fill="#9b9484" font-size="12.5" font-family="monospace">moveCost = landMult · (1 − slope·0.62)</text>
    <rect x="40" y="116" width="430" height="380" rx="6" fill="#1c1812" stroke="#3a352b"/>
    <!-- contours: closely spaced = steep band in the middle -->
    <g stroke="#4f4636" fill="none" stroke-width="1.4">
      <path d="M50,470 Q255,455 460,470"/>
      <path d="M50,440 Q255,425 460,440"/>
      <path d="M50,408 Q255,395 460,408"/>
      <!-- steep band: contours bunched together -->
      <path d="M50,360 Q255,348 460,360" stroke="#7a4a3a"/>
      <path d="M50,348 Q255,336 460,348" stroke="#7a4a3a"/>
      <path d="M50,336 Q255,324 460,336" stroke="#7a4a3a"/>
      <path d="M50,324 Q255,312 460,324" stroke="#7a4a3a"/>
      <path d="M50,312 Q255,300 460,312" stroke="#7a4a3a"/>
      <path d="M50,300 Q255,288 460,300" stroke="#7a4a3a"/>
      <path d="M50,250 Q255,238 460,250"/>
      <path d="M50,210 Q255,198 460,210"/>
      <path d="M50,170 Q255,160 460,170"/>
    </g>
    <text x="392" y="330" fill="#b56a55" font-size="11" font-style="italic">steep face</text>
    <text x="392" y="344" fill="#b56a55" font-size="11" font-style="italic">(slope&gt;1.25</text>
    <text x="392" y="358" fill="#b56a55" font-size="11" font-style="italic">= “cliff”)</text>
    <!-- start (gate) bottom, OP top -->
    <circle cx="240" cy="470" r="9" fill="#f0d24a"/><text x="240" y="492" fill="#cabfa9" font-size="12" text-anchor="middle">COP gate</text>
    <circle cx="248" cy="150" r="9" fill="#62e06e"/><text x="248" y="142" fill="#bfe6c2" font-size="12" text-anchor="middle">OP objective</text>
    <!-- straight line the player wants -->
    <line x1="240" y1="470" x2="248" y2="150" stroke="#e9e0cf" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="150" y="300" fill="#c9b96f" font-size="11" transform="rotate(-88 150 300)">what you expect (blocked)</text>
    <!-- the ✗ on the steep band -->
    <text x="262" y="330" fill="#e8584a" font-size="22" font-weight="bold">✗</text>
    <!-- actual route: swings far right and around -->
    <path d="M240,470 C370,470 455,435 452,335 C449,238 350,180 256,158" fill="none" stroke="#3fd2e6" stroke-width="3"/>
    <text x="430" y="250" fill="#5fd4e6" font-size="11" transform="rotate(-90 430 250)">planner’s actual route → up the shallow side</text>
  </g>

  <!-- ===================== RIGHT: recommended (anisotropic) ===================== -->
  <g transform="translate(500,0)">
    <text x="40" y="78" fill="#9fd0a6" font-size="18" font-weight="bold">FIX · anisotropic, signed-grade cost</text>
    <text x="40" y="100" fill="#9b9484" font-size="12.5" font-family="monospace">W = 6·e^(−3.5·|S + 0.05|)   (Tobler)</text>
    <rect x="40" y="116" width="430" height="380" rx="6" fill="#1c1812" stroke="#3a352b"/>
    <g stroke="#4f4636" fill="none" stroke-width="1.4">
      <path d="M50,470 Q255,455 460,470"/>
      <path d="M50,440 Q255,425 460,440"/>
      <path d="M50,408 Q255,395 460,408"/>
      <path d="M50,360 Q255,348 460,360" stroke="#5c6a45"/>
      <path d="M50,348 Q255,336 460,348" stroke="#5c6a45"/>
      <path d="M50,336 Q255,324 460,336" stroke="#5c6a45"/>
      <path d="M50,324 Q255,312 460,324" stroke="#5c6a45"/>
      <path d="M50,312 Q255,300 460,312" stroke="#5c6a45"/>
      <path d="M50,300 Q255,288 460,300" stroke="#5c6a45"/>
      <path d="M50,250 Q255,238 460,250"/>
      <path d="M50,210 Q255,198 460,210"/>
      <path d="M50,170 Q255,160 460,170"/>
    </g>
    <text x="386" y="332" fill="#8aa06a" font-size="11" font-style="italic">same steep face,</text>
    <text x="386" y="346" fill="#8aa06a" font-size="11" font-style="italic">climbable on the</text>
    <text x="386" y="360" fill="#8aa06a" font-size="11" font-style="italic">diagonal</text>
    <circle cx="240" cy="470" r="9" fill="#f0d24a"/><text x="240" y="492" fill="#cabfa9" font-size="12" text-anchor="middle">COP gate</text>
    <circle cx="240" cy="150" r="9" fill="#62e06e"/><text x="240" y="142" fill="#bfe6c2" font-size="12" text-anchor="middle">OP objective</text>
    <!-- switchback zigzag up through the steep band -->
    <polyline points="240,470 320,408 168,360 322,312 176,270 300,224 240,150" fill="none" stroke="#3fd2e6" stroke-width="3" stroke-linejoin="round"/>
    <text x="60" y="250" fill="#5fd4e6" font-size="11">switchbacks emerge:</text>
    <text x="60" y="266" fill="#5fd4e6" font-size="11">diagonal legs hold a</text>
    <text x="60" y="282" fill="#5fd4e6" font-size="11">gentle effective grade</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="40" y="516" width="900" height="86" rx="6" fill="#1c1812" stroke="#3a352b"/>
  <text x="58" y="544" fill="#d8cdb6" font-size="14"><tspan font-weight="bold" fill="#e0a39a">The mechanism —</tspan>&#160;cost depends only on a cell’s slope <tspan font-style="italic">magnitude</tspan>, identical in every heading. A switchback crosses MORE cells, each as costly</text>
  <text x="58" y="566" fill="#d8cdb6" font-size="14">sideways as straight-up, so it never pays off; meanwhile slope&gt;1.25 cells are hard-blocked, fragmenting a climbable face into fake cliffs. The planner’s</text>
  <text x="58" y="588" fill="#d8cdb6" font-size="14">only cheap option is the long way around. <tspan fill="#9fd0a6">A signed-grade (anisotropic) cost makes a diagonal traverse genuinely cheaper → switchbacks appear above ~25% grade.</tspan></text>
</svg>
