<svg xmlns='http://www.w3.org/2000/svg' width='760' height='580' viewBox='0 0 760 580'>
<rect width='760' height='580' fill='#161812'/><text x='380' y='30' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='19' fill='#d8a657' text-anchor='middle' font-weight='700' >TO SCALE: A SOLDIER AND HIS OUTPOST</text><text x='380' y='51' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#9a9686' text-anchor='middle'  font-style='italic'>every shape below drawn at one consistent scale — 2.6 px = 1 metre</text><circle cx='300' cy='335' r='221' fill='none' stroke='#e8e4d8' stroke-width='2' stroke-dasharray='3 4'/><text x='300' y='106' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='13' fill='#e8e4d8' text-anchor='middle'  >COMBAT OUTPOST — 170 m across</text><rect x='330' y='265' width='78' height='78' fill='#6f8f4e' opacity='0.35' stroke='#6f8f4e' stroke-width='1.5'/><text x='369' y='257' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11' fill='#6f8f4e' text-anchor='middle'  >qalat 30 m</text><circle cx='230' cy='375' r='27.82' fill='#c8553d' opacity='0.45' stroke='#c8553d' stroke-width='1.5'/><text x='230' y='418.82' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11.5' fill='#c8553d' text-anchor='middle' font-weight='700' >soldier AS DRAWN</text><text x='230' y='433.82' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11.5' fill='#c8553d' text-anchor='middle'  >(default zoom): 21 m</text><circle cx='308' cy='390' r='1' fill='#e8e4d8'/><line x1='308' y1='390' x2='450' y2='485' stroke='#9a9686' stroke-width='1'/><text x='456' y='485' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' fill='#e8e4d8' text-anchor='start'  >real soldier: 0.6 m</text><text x='456' y='502' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11' fill='#9a9686' text-anchor='start'  >(the speck — 1.7 px here)</text><line x1='60' y1='540' x2='320' y2='540' stroke='#e8e4d8' stroke-width='2'/><line x1='60' y1='535' x2='60' y2='545' stroke='#e8e4d8' stroke-width='2'/><line x1='320' y1='535' x2='320' y2='545' stroke='#e8e4d8' stroke-width='2'/><text x='190' y='531' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' fill='#e8e4d8' text-anchor='middle'  >100 m</text><rect x='440' y='225' width='300' height='150' fill='#1d2018' stroke='#2c2f26' rx='6'/><text x='455' y='250' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='13' fill='#d8a657' text-anchor='start' font-weight='700' >THE MISMATCH</text><text x='455' y='273' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#c8553d' text-anchor='start'  >Drawn soldier : 21 m</text><text x='455' y='292' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#e8e4d8' text-anchor='start'  >Real soldier  : 0.6 m</text><text x='455' y='315' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#9a9686' text-anchor='start'  >→ 36× too large at the</text><text x='455' y='331' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#9a9686' text-anchor='start'  >   default zoom.</text><text x='455' y='357' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' fill='#9a9686' text-anchor='start'  >A man is painted as wide</text><text x='455' y='373' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' fill='#9a9686' text-anchor='start'  >as 2/3 of a compound.</text></svg>