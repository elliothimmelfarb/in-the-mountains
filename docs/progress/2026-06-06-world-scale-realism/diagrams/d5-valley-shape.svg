<svg xmlns='http://www.w3.org/2000/svg' width='860' height='380' viewBox='0 0 860 380'>
<rect width='860' height='380' fill='#161812'/><text x='430' y='32' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='18' fill='#d8a657' text-anchor='middle' font-weight='700' >THE MAP IS ONE SEGMENT OF A LONG, NARROW VALLEY</text><text x='430' y='53' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#9a9686' text-anchor='middle'  font-style='italic'>real Korengal floor (≈10:1 slot) vs the game's 2.56 km square, drawn to one scale</text><rect x='70' y='185.25' width='640.2' height='49.5' rx='6' fill='#6f8f4e' opacity='0.16' stroke='#6f8f4e' stroke-width='1.5'/><text x='710.2' y='176.25' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12' fill='#6f8f4e' text-anchor='end'  >REAL KORENGAL: ~9.7 km × ~0.5–1.0 km</text><rect x='90' y='125.52' width='168.96' height='168.96' fill='#c8553d' opacity='0.14' stroke='#c8553d' stroke-width='2' stroke-dasharray='5 4'/><text x='174.48000000000002' y='115.52' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='12.5' fill='#c8553d' text-anchor='middle' font-weight='700' >GAME MAP</text><text x='174.48000000000002' y='312.48' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11.5' fill='#c8553d' text-anchor='middle'  >2.56 km square</text><line x1='90' y1='324.48' x2='258.96000000000004' y2='324.48' stroke='#9a9686' stroke-width='1'/><text x='174.48000000000002' y='339.48' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11' fill='#9a9686' text-anchor='middle'  >≈ 1 / 3.8 of the valley's length</text><line x1='70' y1='350' x2='136' y2='350' stroke='#e8e4d8' stroke-width='2'/><line x1='70' y1='346' x2='70' y2='354' stroke='#e8e4d8' stroke-width='2'/><line x1='136' y1='346' x2='136' y2='354' stroke='#e8e4d8' stroke-width='2'/><text x='144' y='354' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='11' fill='#e8e4d8' text-anchor='start'  >1 km</text><text x='840' y='366' font-family='ui-monospace,Menlo,Consolas,monospace' font-size='10.5' fill='#9a9686' text-anchor='end'  font-style='italic'>note: the model's floor gradient also runs the wrong way (real Korengal drains north)</text></svg>