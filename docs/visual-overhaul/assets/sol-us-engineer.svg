<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US COMBAT ENGINEER (sapper), top-down, facing +x. ROTATING.
       Rifleman silhouette + a METAL-DETECTOR / SWEEP WAND held FORWARD-LOW (the utility
       tell) sweeping a search head over the ground, PLUS a tool kit / charge pouch on the
       back. Weapon slung to the rear-side so both hands work the wand. -->
  <defs>
    <radialGradient id="solUsEng-helm" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#868a52"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#3c4028"/>
    </radialGradient>
    <linearGradient id="solUsEng-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#454830"/>
    </linearGradient>
    <linearGradient id="solUsEng-pack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b6f4a"/>
      <stop offset="1" stop-color="#42442c"/>
    </linearGradient>
    <filter id="solUsEng-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="11.5" ry="10.2" fill="#181308" opacity="0.30" filter="url(#solUsEng-soft)"/>

  <!-- TOOL KIT / charge pouch on the back (rear, along -x) -->
  <rect x="12.4" y="20.2" width="6.2" height="7.6" rx="1.1" fill="url(#solUsEng-pack)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="12.4" y1="24" x2="18.6" y2="24" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="13.4" y="21.2" width="1.8" height="1.6" rx="0.3" fill="#3a3c26"/> <!-- pouch flap -->

  <!-- shoulders / torso -->
  <path d="M18 16.5
           q-3.2 0.4 -3.2 7.5 q0 7.1 3.2 7.5
           q6 0.7 11 -1.4 q2.6 -1.1 2.6 -6.1 q0 -5 -2.6 -6.1 q-5 -2.1 -11 -1.4z"
        fill="url(#solUsEng-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <ellipse cx="19.5" cy="18.4" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.5" cy="29.6" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- carbine slung diagonally to the rear-side (kept clear of the wand) -->
  <g stroke-linecap="round">
    <line x1="17.6" y1="29.4" x2="29" y2="32.6" stroke="#1d1b15" stroke-width="2.1"/>
    <line x1="17.6" y1="29.4" x2="29" y2="32.6" stroke="#3a382c" stroke-width="0.8"/>
    <circle cx="29.1" cy="32.7" r="0.7" fill="#141310"/>
  </g>

  <!-- BOTH arms forward, gripping the sweep wand -->
  <path d="M21.8 20.4 q6 0.6 10 4" fill="none" stroke="#4d5132" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M22.4 27.8 q5.5 0.2 9.2 3" fill="none" stroke="#4d5132" stroke-width="2.9" stroke-linecap="round"/>

  <!-- METAL-DETECTOR / SWEEP WAND held forward-low with a flat search head over the ground -->
  <g stroke-linecap="round">
    <!-- shaft from hands out forward-down -->
    <line x1="29" y1="24" x2="41.5" y2="29.5" stroke="#9a978c" stroke-width="1.6"/>
    <line x1="29" y1="24" x2="41.5" y2="29.5" stroke="#c7c4b6" stroke-width="0.6" stroke-opacity="0.7"/>
    <!-- control box near the grip -->
    <rect x="30.4" y="23" width="3" height="2.4" rx="0.5" fill="#3a3c26" stroke="#0f0e0a" stroke-width="0.4"
          transform="rotate(24 31.9 24.2)"/>
  </g>
  <!-- flat oval SEARCH HEAD skimming the ground (the unmistakable engineer tell) -->
  <ellipse cx="42.2" cy="30" rx="3.4" ry="2.3" fill="#b0ada0" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.65"
           transform="rotate(24 42.2 30)"/>
  <ellipse cx="42.2" cy="30" rx="1.7" ry="1.0" fill="#8a8779" transform="rotate(24 42.2 30)"/>

  <!-- faction accent: US-blue IR flag on rear-left shoulder -->
  <g transform="rotate(-22 18 19)">
    <rect x="15.8" y="17.6" width="5" height="2.9" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="16" y1="19.05" x2="20.6" y2="19.05" stroke="#cfe0f0" stroke-width="0.5" stroke-opacity="0.75"/>
  </g>

  <!-- helmet (ACH) — focal head, NW top-light + NVG mount at front -->
  <circle cx="25.4" cy="24" r="5.7" fill="url(#solUsEng-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <path d="M21.2 20.6 a5.7 5.7 0 0 1 4.6 -1.9" fill="none" stroke="#cfd2a4" stroke-width="1.05" stroke-opacity="0.7" stroke-linecap="round"/>
  <rect x="30.3" y="22.9" width="2.5" height="2.3" rx="0.6" fill="#2b2920"/>
</svg>
