<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- DUST PUFF for small-arms impacts / blast dust. fx-particles family.
       Flat ground/airborne dust → NO directional cast shadow. Radial soft falloff,
       dirtier center (#786c54) → warm tan (#9c8d63) → feathered transparent edge,
       plus a couple of small flung flecks. anchor [0.5,0.55], footprint 1.5 m,
       rotating false. Restrained — dirt kicked up, not a cartoon poof. -->
  <defs>
    <radialGradient id="fxDustPuff-cloud" cx="0.47" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#786c54" stop-opacity="0.72"/>
      <stop offset="0.34" stop-color="#857857" stop-opacity="0.58"/>
      <stop offset="0.66" stop-color="#9c8d63" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9c8d63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fxDustPuff-lobe" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9c8d63" stop-opacity="0.38"/>
      <stop offset="0.68" stop-color="#9c8d63" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9c8d63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer feathered tan lobes (irregular cloud, slightly off-center NE/SE billows) -->
  <ellipse cx="12.4" cy="13.0" rx="8.6" ry="6.8" fill="url(#fxDustPuff-lobe)"/>
  <ellipse cx="19.6" cy="17.6" rx="7.4" ry="6.2" fill="url(#fxDustPuff-lobe)"/>
  <ellipse cx="20.2" cy="11.8" rx="5.6" ry="4.8" fill="url(#fxDustPuff-lobe)"/>

  <!-- main cloud body with dirty core -->
  <ellipse cx="15.4" cy="14.8" rx="8.8" ry="7.6" fill="url(#fxDustPuff-cloud)"/>
  <!-- denser inner billows to break the circle and concentrate the dirty core -->
  <ellipse cx="14.0" cy="13.8" rx="3.8" ry="3.0" fill="#786c54" opacity="0.40"/>
  <ellipse cx="18.4" cy="16.2" rx="3.0" ry="2.5" fill="#857857" opacity="0.30"/>
  <ellipse cx="15.6" cy="15.2" rx="1.9" ry="1.6" fill="#6c624c" opacity="0.36"/>

  <!-- a couple of small flung flecks of darker dirt -->
  <circle cx="6.0" cy="9.2" r="0.75" fill="#6c624c" opacity="0.66"/>
  <circle cx="27.2" cy="10.2" r="0.65" fill="#6c624c" opacity="0.6"/>
  <circle cx="24.8" cy="23.8" r="0.6" fill="#786c54" opacity="0.56"/>
  <circle cx="8.6" cy="23.2" r="0.55" fill="#786c54" opacity="0.5"/>
</svg>
