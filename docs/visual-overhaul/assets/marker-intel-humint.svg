<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- HUMINT report glyph: informant silhouette inside a speech mark. FLAT milspec ink, green.
       footprint:null (screen-fixed), anchor [0.5,0.5], rotating:false. -->
  <defs>
    <filter id="markerIntelHumint-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>
  <!-- dark keyline halo behind -->
  <g filter="url(#markerIntelHumint-halo)" stroke="#0c0d0a" stroke-opacity="0.5" stroke-width="2.3" fill="#0c0d0a" fill-opacity="0.5" stroke-linejoin="round">
    <path d="M5 5.5 a3 3 0 0 1 3-3 h8 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-4.6 L7.6 21 V14.5 H8 a3 3 0 0 1 -3 -3 z"/>
  </g>
  <!-- green speech mark frame -->
  <path d="M5 5.5 a3 3 0 0 1 3-3 h8 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-4.6 L7.6 21 V14.5 H8 a3 3 0 0 1 -3 -3 z"
        fill="none" stroke="#6fae54" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- informant silhouette: head + shoulders -->
  <g fill="#6fae54">
    <circle cx="12" cy="6.7" r="2"/>
    <path d="M7.7 13.4 a4.3 4.3 0 0 1 8.6 0 z"/>
  </g>
</svg>
