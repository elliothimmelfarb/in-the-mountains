<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- BAZAAR STALL: market stall, wood frame + colorful faded awning (red/teal) + goods
       laid out. A touch of civilian commerce. STATIC, NW light. anchor [0.5,0.82],
       footprint 5 m. -->
  <defs>
    <linearGradient id="bzr-awn-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b56a52"/>
      <stop offset="1" stop-color="#8c4636"/>
    </linearGradient>
    <linearGradient id="bzr-awn-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fa39a"/>
      <stop offset="1" stop-color="#477069"/>
    </linearGradient>
    <linearGradient id="bzr-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a44"/>
      <stop offset="1" stop-color="#664c30"/>
    </linearGradient>
    <filter id="bzr-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- SE cast shadow of the awning/stall -->
  <ellipse cx="26" cy="36" rx="16" ry="6" fill="#1c160e" opacity="0.30" filter="url(#bzr-soft)"/>

  <!-- four corner posts (timber), NW posts lit, SE posts dark -->
  <g stroke-linecap="round">
    <line x1="11" y1="34" x2="11" y2="18" stroke="#3a2a1a" stroke-width="2.0"/>
    <line x1="11" y1="33" x2="11" y2="19" stroke="#8a6a44" stroke-width="0.9"/>
    <line x1="37" y1="34.5" x2="37.6" y2="19" stroke="#2e2012" stroke-width="2.0"/>
    <line x1="37" y1="33.5" x2="37.5" y2="20" stroke="#5a4228" stroke-width="0.8"/>
  </g>

  <!-- goods table under the awning -->
  <path d="M9 33 h28 l2.5 4 h-28z" fill="url(#bzr-table)" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.55"/>
  <path d="M9 33 h28 v-1.2 h-28z" fill="#a07a4e" opacity="0.7"/>
  <!-- goods laid out: baskets / sacks / fruit in warm tones -->
  <g stroke="#3a2a18" stroke-width="0.3">
    <ellipse cx="14" cy="34.2" rx="2.4" ry="1.5" fill="#b5532a"/>
    <ellipse cx="20" cy="34.4" rx="2.4" ry="1.5" fill="#c2a878"/>
    <ellipse cx="26" cy="34.2" rx="2.4" ry="1.5" fill="#8a984e"/>
    <ellipse cx="31.5" cy="34.5" rx="2.2" ry="1.4" fill="#a06a3a"/>
    <circle cx="13" cy="33.6" r="0.7" fill="#d8b94a"/><circle cx="15" cy="33.7" r="0.7" fill="#d8b94a"/>
    <circle cx="25" cy="33.6" r="0.7" fill="#b5532a"/><circle cx="27" cy="33.7" r="0.7" fill="#b5532a"/>
  </g>

  <!-- AWNING seen TOP-DOWN with a slight tilt: a pitched canvas whose TOP face dominates,
       with a thin SE-shadow front valance sliver. Ridge runs E-W along the back (NW-lit),
       canvas falls toward the viewer (SE). Faded red + teal stripes alternate across it. -->
  <!-- awning soft cast shade onto the table -->
  <path d="M8.5 18.5 h31 l1.5 7 h-31z" fill="#1c160e" opacity="0.14"/>
  <!-- top face of the awning (parallelogram, NW ridge -> SE eave) -->
  <path d="M9 17.5 h28 l3 8 h-31z" fill="url(#bzr-awn-red)" stroke="#5a2e22" stroke-width="0.6" stroke-opacity="0.7"/>
  <!-- alternating teal stripes running with the slope (ridge->eave) -->
  <g fill="url(#bzr-awn-teal)" opacity="0.95">
    <path d="M13 17.5 h4 l1.4 8 h-4z"/>
    <path d="M21 17.5 h4 l1.5 8 h-4z"/>
    <path d="M29 17.5 h4 l1.6 8 h-4z"/>
  </g>
  <!-- stripe seam lines -->
  <g stroke="#e6d8c0" stroke-width="0.4" stroke-opacity="0.4">
    <line x1="13" y1="17.5" x2="14.4" y2="25.5"/><line x1="17" y1="17.5" x2="18.4" y2="25.5"/>
    <line x1="21" y1="17.5" x2="22.5" y2="25.5"/><line x1="25" y1="17.5" x2="26.5" y2="25.5"/>
    <line x1="29" y1="17.5" x2="30.6" y2="25.5"/><line x1="33" y1="17.5" x2="34.6" y2="25.5"/>
  </g>
  <!-- thin SE-shadow front valance sliver under the eave -->
  <path d="M9 25.5 h31 l0.3 1.5 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.6 1.4 -3.2 0 q-1.4 1 -2.7 0z" fill="#8c4636" stroke="#5a2e22" stroke-width="0.4" stroke-opacity="0.7"/>
  <!-- NW rim light along the ridge -->
  <line x1="9" y1="17.5" x2="37" y2="17.5" stroke="#f3ecd6" stroke-width="0.8" stroke-opacity="0.65"/>
</svg>
