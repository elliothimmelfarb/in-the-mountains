<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 52">
  <!-- ARMORY: hardened conex, bunkered with sandbag revetment, heavy steel door, no windows.
       VOLUME: clear extruded box, lit NW wall band + shaded SE wall band, NW rim, SE cast shadow.
       STATIC: NW light + SE cast shadow. anchor [0.5,0.82]. footprint 6 m. -->
  <defs>
    <linearGradient id="bldArmory-roof" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#9e8e60"/>
      <stop offset="1" stop-color="#80724a"/>
    </linearGradient>
    <linearGradient id="bldArmory-nw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82764f"/>
      <stop offset="1" stop-color="#665c40"/>
    </linearGradient>
    <linearGradient id="bldArmory-se" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c452e"/>
      <stop offset="1" stop-color="#383222"/>
    </linearGradient>
    <radialGradient id="bldArmory-bag" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#bcab78"/>
      <stop offset="1" stop-color="#92835a"/>
    </radialGradient>
    <radialGradient id="bldArmory-bagS" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#9a8d61"/>
      <stop offset="1" stop-color="#736845"/>
    </radialGradient>
    <filter id="bldArmory-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- SOFT SE CAST SHADOW on the ground, offset down-right -->
  <ellipse cx="32" cy="45" rx="23" ry="7" fill="#1c160e" opacity="0.21" filter="url(#bldArmory-soft)"/>

  <!-- back/right sandbag revetment (behind conex, SE side) in shade -->
  <g stroke="#564c32" stroke-width="0.4">
    <ellipse cx="47" cy="21" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
    <ellipse cx="47.5" cy="25" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
    <ellipse cx="48" cy="29" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
  </g>

  <!-- ===== EXTRUDED BOX ===== -->
  <!-- SE end wall band (shaded, thin sliver of the right end) -->
  <polygon points="42,15 42,34 46.5,31 46.5,12" fill="url(#bldArmory-se)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- NW long WALL BAND (lit, tall & clearly visible) -->
  <polygon points="10,17 42,15 42,34 10,36" fill="url(#bldArmory-nw)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- corrugation ribs on the lit wall -->
  <g stroke="#473f2b" stroke-width="0.5" stroke-opacity="0.6">
    <line x1="14" y1="16.7" x2="14" y2="35.7"/><line x1="18" y1="16.5" x2="18" y2="35.5"/>
    <line x1="22" y1="16.2" x2="22" y2="35.2"/><line x1="30" y1="15.8" x2="30" y2="34.8"/>
    <line x1="34" y1="15.6" x2="34" y2="34.6"/><line x1="38" y1="15.4" x2="38" y2="34.4"/>
  </g>
  <!-- highlight catch between ribs -->
  <g stroke="#9a8c64" stroke-width="0.4" stroke-opacity="0.4">
    <line x1="16" y1="16.6" x2="16" y2="35.6"/><line x1="36" y1="15.5" x2="36" y2="34.5"/>
  </g>

  <!-- TOP / ROOF face (NW lit, earth/sandbag-covered hardened roof) -->
  <polygon points="10,17 42,15 46.5,12 14.5,14" fill="url(#bldArmory-roof)" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.45"/>
  <!-- sandbag course along the roof crest -->
  <g stroke="#776b46" stroke-width="0.4">
    <ellipse cx="18" cy="13.7" rx="2.6" ry="1.4" fill="url(#bldArmory-bag)"/>
    <ellipse cx="23" cy="13.3" rx="2.6" ry="1.4" fill="url(#bldArmory-bag)"/>
    <ellipse cx="28" cy="13" rx="2.6" ry="1.4" fill="url(#bldArmory-bag)"/>
    <ellipse cx="33" cy="12.7" rx="2.6" ry="1.4" fill="url(#bldArmory-bag)"/>
    <ellipse cx="38" cy="12.4" rx="2.6" ry="1.4" fill="url(#bldArmory-bag)"/>
  </g>
  <!-- STRONG NW RIM LIGHT along top-back/left roof edge -->
  <polyline points="11,16.9 14.5,14 46.3,12.1" fill="none" stroke="#efe3b6" stroke-width="1.0" stroke-opacity="0.62"/>
  <!-- SE roof edge stays dark -->
  <line x1="10" y1="17" x2="42" y2="15" stroke="#2c2618" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- front (NW/west) sandbag revetment stacked against the lit wall, 2 courses -->
  <g stroke="#776b46" stroke-width="0.45">
    <ellipse cx="10.5" cy="32" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
    <ellipse cx="10.5" cy="36" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
    <ellipse cx="13.5" cy="39" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="19" cy="39.4" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="24.5" cy="39.4" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="30" cy="39.2" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="35.5" cy="39" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
    <ellipse cx="16" cy="42.4" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="22" cy="42.6" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="28" cy="42.6" rx="3.4" ry="2" fill="url(#bldArmory-bag)"/>
    <ellipse cx="34" cy="42.4" rx="3.4" ry="2" fill="url(#bldArmory-bagS)"/>
  </g>

  <!-- heavy steel door (centered on lit wall, recessed dark) -->
  <rect x="22.6" y="19.6" width="6.8" height="13" rx="0.4" fill="#393424" fill-opacity="0.25" stroke="none"/>
  <rect x="23" y="20" width="6" height="12.4" rx="0.4" fill="#3a3526" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.6"/>
  <line x1="23" y1="24.4" x2="29" y2="24.4" stroke="#564e36" stroke-width="0.7"/>
  <line x1="23" y1="28.4" x2="29" y2="28.4" stroke="#564e36" stroke-width="0.7"/>
  <rect x="28.1" y="25.4" width="1" height="2.6" fill="#857a5c"/>
  <!-- NW edge highlight on door frame -->
  <line x1="23" y1="20" x2="23" y2="32.4" stroke="#9a8c64" stroke-width="0.5" stroke-opacity="0.6"/>
</svg>
