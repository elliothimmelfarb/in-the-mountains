<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- WALNUT variant B (round broadleaf orchard tree), top-down. STATIC.
       Same family as tree-walnut but a LOPSIDED, slightly larger canopy with a heavier
       east lobe and a small north bulge, for orchard variety. anchor [0.5,0.62], footprint 6 m. -->
  <defs>
    <radialGradient id="treeWalnutB-canopy" cx="0.36" cy="0.32" r="0.76">
      <stop offset="0" stop-color="#7a9a52"/>
      <stop offset="0.5" stop-color="#4e6c36"/>
      <stop offset="1" stop-color="#374f28"/>
    </radialGradient>
    <radialGradient id="treeWalnutB-lit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#aecb7c"/>
      <stop offset="1" stop-color="#aecb7c" stop-opacity="0"/>
    </radialGradient>
    <filter id="treeWalnutB-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="treeWalnutB-softlit" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- SE cast shadow: stronger + tight dark core -->
  <ellipse cx="28" cy="31" rx="16" ry="11" fill="#160f08" opacity="0.42" filter="url(#treeWalnutB-soft)"/>
  <ellipse cx="27.5" cy="30" rx="10" ry="6.5" fill="#120c06" opacity="0.34" filter="url(#treeWalnutB-soft)"/>

  <!-- lopsided round lobed canopy: heavier east lobe, smooth crown -->
  <path d="M23 5
           q6 -1.5 10 1.5 q4.5 3 3.5 8.5 q2 5.5 -3.5 8.8 q-3.5 3.4 -8.5 2.2
           q-6.5 1.6 -10.5 -3.6 q-4 -4 -1.5 -9.2 q-1.2 -6 5.5 -8.2 q0.8 -0.6 2 -0.8z"
        fill="url(#treeWalnutB-canopy)" stroke="#15100a" stroke-width="1.0" stroke-opacity="0.7"/>

  <!-- broad soft NW lit wash -->
  <ellipse cx="18" cy="14" rx="11" ry="10" fill="url(#treeWalnutB-lit)" opacity="0.6" filter="url(#treeWalnutB-softlit)"/>

  <!-- NW lit crescent: brighter, broader lit cap upper-left -->
  <path d="M23 5 q-7 0.8 -10.5 6 q-2.2 3.6 -1 7 q3.4 -5.6 8.6 -7.6 q3.6 -1.4 7.6 -1.3 q-1.4 -3.6 -4.7 -4.1z"
        fill="#92b463" opacity="0.92"/>
  <!-- inner bright lobe near lit cap -->
  <ellipse cx="18.5" cy="12.5" rx="4.8" ry="3.8" fill="#a6c272" opacity="0.7"/>
  <!-- NW rim highlight -->
  <path d="M13.5 11 q4.6 -4.6 10 -4.4" fill="none" stroke="#cfe2a0" stroke-width="1.1" stroke-opacity="0.85" stroke-linecap="round"/>

  <!-- leaf-clump lobes (a few deliberate blobs, weighted east) -->
  <g opacity="0.5">
    <circle cx="19" cy="13" r="3.2" fill="#6a8a48"/>
    <circle cx="30" cy="14" r="3.6" fill="#43602f"/>
    <circle cx="33" cy="22" r="3.8" fill="#374f28"/>
    <circle cx="28" cy="26" r="3.4" fill="#43602f"/>
    <circle cx="20" cy="24" r="3.2" fill="#43602f"/>
    <circle cx="24" cy="18" r="2.6" fill="#5e7e3e"/>
  </g>
  <!-- darker SE underside crescent (heavier on the east lobe) -->
  <path d="M33 24 q4 -3 4.5 -8 q1.6 5.6 -1.6 9.8 q-1.8 2 -2.9 -1.8z" fill="#26401d" opacity="0.6"/>
  <path d="M23 32 q5.5 1.6 11 -2 q-3.2 4.4 -9.8 3.8 q-1.8 -0.2 -1.2 -1.8z" fill="#26401d" opacity="0.4"/>
</svg>
