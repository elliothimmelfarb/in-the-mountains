<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US CASUALTY, top-down, a soldier DOWN. ROTATING: symmetric contact shadow +
       rotation-tolerant gentle top light. Authored facing +x (east) = head toward east.
       anchor [0.5,0.55], footprint 1.6 m. READ at 24px: a clearly HORIZONTAL, slack
       silhouette (head one end, splayed loose limbs, weapon fallen aside) -> "a man down". -->
  <defs>
    <radialGradient id="solUsCasualty-helm" cx="0.42" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#7a7e4c"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#393d26"/>
    </radialGradient>
    <linearGradient id="solUsCasualty-body" x1="0.2" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#454830"/>
    </linearGradient>
    <radialGradient id="solUsCasualty-blood" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9c2c20"/>
      <stop offset="0.65" stop-color="#7a1f18"/>
      <stop offset="1" stop-color="#7a1f18" stop-opacity="0"/>
    </radialGradient>
    <filter id="solUsCasualty-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- symmetric soft contact shadow (under the slack body, not directional) -->
  <ellipse cx="22.5" cy="24.8" rx="15" ry="7.4" fill="#181308" opacity="0.26" filter="url(#solUsCasualty-soft)"/>

  <!-- blood pool seeping out from under the torso, biased to one side so it READS -->
  <ellipse cx="18" cy="29.4" rx="6.2" ry="3.4" fill="url(#solUsCasualty-blood)" opacity="0.9"/>

  <!-- fallen weapon: M4 DROPPED askew above the body — angled away, clearly discarded
       (muzzle low toward the body, butt flung high-west) so it reads as fallen, not carried -->
  <g stroke-linecap="round">
    <line x1="11.5" y1="11.8" x2="29" y2="18.6" stroke="#1d1b15" stroke-width="2.1"/>
    <line x1="11.5" y1="11.8" x2="29" y2="18.6" stroke="#3a382c" stroke-width="0.85"/>
    <line x1="20.4" y1="13.4" x2="18.4" y2="16.0" stroke="#201e17" stroke-width="1.9"/> <!-- magazine -->
    <circle cx="29" cy="18.6" r="0.9" fill="#141310"/> <!-- muzzle -->
    <rect x="10.4" y="10.6" width="2.4" height="2.0" rx="0.5" fill="#23211a" transform="rotate(21 11.6 11.6)"/> <!-- buttstock -->
  </g>

  <!-- LEGS: splayed loose toward the rear (-x / west), bent at slack angles -->
  <path d="M17 22.6 q-7.8 -2.0 -12.4 -5.4" fill="none" stroke="#4d5132" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M17 26.4 q-7.4 2.6 -12 6.2" fill="none" stroke="#4d5132" stroke-width="3.6" stroke-linecap="round"/>
  <!-- boots -->
  <ellipse cx="4.4" cy="16.8" rx="2.1" ry="1.6" fill="#2b2920" transform="rotate(-22 4.4 16.8)"/>
  <ellipse cx="4.8" cy="32.6" rx="2.1" ry="1.6" fill="#2b2920" transform="rotate(24 4.8 32.6)"/>

  <!-- TORSO: lying lengthwise along x, slumped/limp, longer than it is wide -->
  <path d="M15 20.4
           q-3.0 0.5 -3.0 4.1 q0 3.6 3.0 4.1
           q7 1.0 13 -0.5 q2.3 -0.6 2.3 -3.6 q0 -3.0 -2.3 -3.6 q-6 -1.5 -13 -0.5z"
        fill="url(#solUsCasualty-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>

  <!-- ARMS: one flung up (north), one slack down (south) — limp, not cradling -->
  <path d="M23 21.4 q3.5 -2.6 8 -2.6" fill="none" stroke="#4d5132" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M24 28.2 q3 2.4 7.5 2.6" fill="none" stroke="#4d5132" stroke-width="2.8" stroke-linecap="round"/>
  <!-- gloved hands -->
  <circle cx="31" cy="18.6" r="1.4" fill="#3c4028"/>
  <circle cx="31.5" cy="30.9" r="1.4" fill="#3c4028"/>

  <!-- faction accent: small US-blue IR flag patch on the shoulder/upper arm -->
  <g transform="rotate(-14 18.5 22)">
    <rect x="16.2" y="20.6" width="4.4" height="2.6" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="16.4" y1="21.9" x2="20.5" y2="21.9" stroke="#cfe0f0" stroke-width="0.45" stroke-opacity="0.75"/>
  </g>

  <!-- HELMET (ACH) at the head end (+x/east), smaller & in proportion, gentle top light -->
  <circle cx="33.2" cy="24.6" r="4.5" fill="url(#solUsCasualty-helm)" stroke="#1c160e" stroke-width="0.9"/>
  <path d="M30.3 21.8 a4.5 4.5 0 0 1 3.4 -1.4" fill="none" stroke="#cfd2a4" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
