<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ANA LEADER, top-down, facing +x (east). ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Rifleman base + RADIO WHIP antenna (leader/RTO cue) arcing back over the shoulder,
       + map/marker hand cue, + double teal armband. Soft cap (officer) read = NOT-US. AK. -->
  <defs>
    <radialGradient id="solAnaLeader-cap" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#83855a"/>
      <stop offset="0.65" stop-color="#565839"/>
      <stop offset="1" stop-color="#3c3e29"/>
    </radialGradient>
    <linearGradient id="solAnaLeader-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#75793f"/>
      <stop offset="1" stop-color="#43472a"/>
    </linearGradient>
    <filter id="solAnaLeader-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="10.6" ry="9.6" fill="#181308" opacity="0.30" filter="url(#solAnaLeader-soft)"/>

  <!-- radio whip antenna: long flexible whip arcing up-back from the radio (leader cue), drawn UNDER body so it reads as kit -->
  <path d="M16.5 27 q-5.5 -3 -8.5 -10.5" fill="none" stroke="#23201a" stroke-width="1.0" stroke-linecap="round"/>
  <circle cx="8" cy="16.5" r="0.9" fill="#2b2920"/>

  <!-- shoulders / torso -->
  <path d="M18 16.8
           q-3 0.4 -3 7.2 q0 6.8 3 7.2
           q5.8 0.7 10.6 -1.3 q2.5 -1.1 2.5 -5.9 q0 -4.8 -2.5 -5.9 q-4.8 -2 -10.6 -1.3z"
        fill="url(#solAnaLeader-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>

  <!-- radio set on the back (small box, leader/RTO cue) -->
  <rect x="15.2" y="22.2" width="3.4" height="3.6" rx="0.6" fill="#3c3e28" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.7" transform="rotate(-12 16.9 24)"/>

  <!-- thin chest rig -->
  <path d="M21.5 20.4 q3.2 3.6 0 7.2" fill="none" stroke="#3f4128" stroke-width="1.6" stroke-opacity="0.85"/>

  <!-- shoulder caps -->
  <ellipse cx="19.6" cy="18.7" rx="3.2" ry="2.4" fill="#62643f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.6" cy="29.3" rx="3.2" ry="2.4" fill="#62643f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- arms -->
  <path d="M21.5 19.8 q7 1.4 12 6.8" fill="none" stroke="#54562f" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M22 28.6 q6.2 -0.6 10.4 2.8" fill="none" stroke="#54562f" stroke-width="2.9" stroke-linecap="round"/>

  <!-- weapon: AK carried diagonally w/ curved mag -->
  <g stroke-linecap="round">
    <line x1="19.7" y1="30.2" x2="38.6" y2="20.6" stroke="#2a1f12" stroke-width="2.4"/>
    <line x1="19.7" y1="30.2" x2="38.6" y2="20.6" stroke="#5a3f24" stroke-width="0.9"/>
    <path d="M26.6 28.6 q-1.4 3.5 1.4 5.5 q0.9 0.6 1.6 0.2" fill="none" stroke="#221d12" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="38.7" cy="20.5" r="0.95" fill="#141310"/>
  </g>

  <!-- faction accent: DOUBLE teal armbands (leader cue) + trim -->
  <g transform="rotate(-20 18 19)">
    <rect x="15.4" y="17.2" width="5.2" height="1.5" rx="0.4" fill="#6fae9f" stroke="#1f3a33" stroke-width="0.35"/>
    <rect x="15.4" y="19.2" width="5.2" height="1.5" rx="0.4" fill="#6fae9f" stroke="#1f3a33" stroke-width="0.35"/>
  </g>

  <!-- soft officer cap — focal head. Rounded soft crown (NO helmet shell), short bill at front = NOT-US -->
  <circle cx="25.4" cy="24" r="5.4" fill="url(#solAnaLeader-cap)" stroke="#1c160e" stroke-width="0.95"/>
  <!-- short cap bill pointing forward (+x) -->
  <path d="M30.3 22.4 q2.6 0.5 2.7 1.6 q-0.1 1.1 -2.7 1.6 z" fill="#4a4c31" stroke="#1c160e" stroke-width="0.55" stroke-opacity="0.7"/>
  <!-- teal cap band (rank/leader) — full ring, rotation-invariant faction accent -->
  <circle cx="25.4" cy="24" r="3.9" fill="none" stroke="#6fae9f" stroke-width="1.3" stroke-opacity="0.95"/>
  <!-- NW top-light -->
  <path d="M21.6 20.8 a5.4 5.4 0 0 1 4.3 -1.7" fill="none" stroke="#d2d4a6" stroke-width="1.0" stroke-opacity="0.7" stroke-linecap="round"/>
</svg>
