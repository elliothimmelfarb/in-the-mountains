<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US MEDIC, top-down, facing +x. ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Based on sol-us-rifleman: same body/helmet/shadow/weapon. Role cues: clear RED CROSS
       on a white patch on the shoulder + an aid bag on the hip. -->
  <defs>
    <radialGradient id="solUsMedic-helm" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#868a52"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#3c4028"/>
    </radialGradient>
    <linearGradient id="solUsMedic-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#454830"/>
    </linearGradient>
    <filter id="solUsMedic-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="11.4" ry="10" fill="#181308" opacity="0.30" filter="url(#solUsMedic-soft)"/>

  <!-- aid bag on the hip (rear-low, -x side): bulky pouch with a red-cross tab -->
  <rect x="13.4" y="25.6" width="5.2" height="5.0" rx="1.0" fill="#4d5132" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.6"/>
  <rect x="14.6" y="27.0" width="2.8" height="2.4" rx="0.4" fill="#f3ecd6" stroke="#1c160e" stroke-width="0.3" stroke-opacity="0.4"/>
  <path d="M15.7 27.2 v2 M14.8 28.2 h1.8" stroke="#9c2c20" stroke-width="0.7"/>

  <!-- shoulders / torso -->
  <path d="M18 16.5
           q-3.2 0.4 -3.2 7.5 q0 7.1 3.2 7.5
           q6 0.7 11 -1.4 q2.6 -1.1 2.6 -6.1 q0 -5 -2.6 -6.1 q-5 -2.1 -11 -1.4z"
        fill="url(#solUsMedic-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <!-- shoulder caps -->
  <ellipse cx="19.5" cy="18.4" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.5" cy="29.6" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- arms cradling the weapon diagonally across the front -->
  <path d="M21.5 19.6 q7 1.4 12.5 7.2" fill="none" stroke="#4d5132" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M22 28.8 q6.5 -0.6 11 3" fill="none" stroke="#4d5132" stroke-width="3.0" stroke-linecap="round"/>

  <!-- weapon: M4 carried diagonally -->
  <g stroke-linecap="round">
    <line x1="19.5" y1="30.5" x2="38.5" y2="20.5" stroke="#1d1b15" stroke-width="2.5"/>
    <line x1="19.5" y1="30.5" x2="38.5" y2="20.5" stroke="#3a382c" stroke-width="1.0"/>
    <line x1="27" y1="29.2" x2="29.6" y2="24.4" stroke="#201e17" stroke-width="2.2"/>
    <circle cx="38.6" cy="20.4" r="1.0" fill="#141310"/>
  </g>

  <!-- RED CROSS on a WHITE patch on the rear shoulder cap (focal medic cue, on top of kit) -->
  <rect x="17.0" y="16.6" width="4.6" height="4.4" rx="0.6" fill="#f3ecd6" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.6"/>
  <path d="M19.3 17.3 v3 M17.8 18.8 h3" stroke="#9c2c20" stroke-width="1.25" stroke-linecap="round"/>

  <!-- faction accent: US-blue IR flag on the FRONT-right shoulder (medic patch took the rear) -->
  <g transform="rotate(-22 28 30)">
    <rect x="25.3" y="28.4" width="5.0" height="2.9" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="25.5" y1="29.85" x2="30.1" y2="29.85" stroke="#cfe0f0" stroke-width="0.5" stroke-opacity="0.75"/>
  </g>

  <!-- helmet (ACH) — focal head, NW top-light + NVG mount front + small red-cross tab on top -->
  <circle cx="25.4" cy="24" r="5.7" fill="url(#solUsMedic-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <path d="M21.2 20.6 a5.7 5.7 0 0 1 4.6 -1.9" fill="none" stroke="#cfd2a4" stroke-width="1.05" stroke-opacity="0.7" stroke-linecap="round"/>
  <rect x="23.6" y="22.5" width="3.0" height="3.0" rx="0.4" fill="#f3ecd6" stroke="#1c160e" stroke-width="0.35" stroke-opacity="0.5"/>
  <path d="M25.1 23.0 v2 M24.1 24.0 h2" stroke="#9c2c20" stroke-width="0.8" stroke-linecap="round"/>
  <rect x="30.3" y="22.9" width="2.5" height="2.3" rx="0.6" fill="#2b2920"/>
</svg>
