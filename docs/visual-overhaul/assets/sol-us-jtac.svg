<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US JTAC (Joint Terminal Attack Controller), top-down, facing +x. ROTATING.
       Rifleman + a RADIO PACK on the back, a small HANDHELD held up at the head (calling
       in air), and a LASER-DESIGNATOR hint forward. Distinct from RTO by the forward optic. -->
  <defs>
    <radialGradient id="solUsJtac-helm" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#868a52"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#3c4028"/>
    </radialGradient>
    <linearGradient id="solUsJtac-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#454830"/>
    </linearGradient>
    <linearGradient id="solUsJtac-pack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c5e3c"/>
      <stop offset="1" stop-color="#3a3c26"/>
    </linearGradient>
    <filter id="solUsJtac-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="11.5" ry="10.2" fill="#181308" opacity="0.30" filter="url(#solUsJtac-soft)"/>

  <!-- RADIO PACK on the back (rear, behind shoulders along -x) with stub antenna -->
  <rect x="12.2" y="20.4" width="6.6" height="7.2" rx="1.2" fill="url(#solUsJtac-pack)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="13.6" y1="21.4" x2="13.6" y2="26.6" stroke="#6b6d47" stroke-width="0.5" stroke-opacity="0.7"/>
  <!-- whip antenna sweeping back -->
  <path d="M13.2 21 q-3.4 -2 -5.2 -4.6" fill="none" stroke="#23211a" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="7.8" cy="16.2" r="0.6" fill="#2b2920"/>

  <!-- shoulders / torso -->
  <path d="M18 16.5
           q-3.2 0.4 -3.2 7.5 q0 7.1 3.2 7.5
           q6 0.7 11 -1.4 q2.6 -1.1 2.6 -6.1 q0 -5 -2.6 -6.1 q-5 -2.1 -11 -1.4z"
        fill="url(#solUsJtac-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <ellipse cx="19.5" cy="18.4" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.5" cy="29.6" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- weapon: slung/carried diagonally low across the body (kept low while calling) -->
  <g stroke-linecap="round">
    <line x1="20" y1="31.2" x2="36" y2="22.6" stroke="#1d1b15" stroke-width="2.3"/>
    <line x1="20" y1="31.2" x2="36" y2="22.6" stroke="#3a382c" stroke-width="0.9"/>
    <line x1="26.4" y1="30" x2="28.6" y2="26.2" stroke="#201e17" stroke-width="2.0"/>
    <circle cx="36.1" cy="22.5" r="0.85" fill="#141310"/>
  </g>

  <!-- lower arm cradling weapon -->
  <path d="M22 29 q5.5 -0.4 9.5 2.4" fill="none" stroke="#4d5132" stroke-width="2.9" stroke-linecap="round"/>

  <!-- UPPER arm raised to head with HANDHELD radio (calling in air) -->
  <path d="M22 19.4 q4.5 -0.2 7.2 1.8" fill="none" stroke="#4d5132" stroke-width="3.0" stroke-linecap="round"/>
  <rect x="28.4" y="18.6" width="3" height="4.4" rx="0.7" fill="#26241c" stroke="#0f0e0a" stroke-width="0.4"
        transform="rotate(18 29.9 20.8)"/>
  <line x1="30.6" y1="18.2" x2="32" y2="16.4" stroke="#23211a" stroke-width="0.7" stroke-linecap="round"/> <!-- handheld antenna -->

  <!-- LASER DESIGNATOR hint: forward optic with a faint beam glint -->
  <rect x="33.4" y="24.6" width="3.6" height="2.2" rx="0.5" fill="#2b2920" stroke="#0f0e0a" stroke-width="0.4"
        transform="rotate(-18 35.2 25.7)"/>
  <circle cx="37" cy="24.5" r="0.85" fill="#7a3f3a"/> <!-- designator aperture (warm) -->
  <line x1="37.4" y1="24.4" x2="44" y2="22" stroke="#c0392b" stroke-width="0.5" stroke-opacity="0.45" stroke-linecap="round"/>

  <!-- faction accent: US-blue IR flag on rear-left shoulder -->
  <g transform="rotate(-22 18 19)">
    <rect x="15.8" y="17.6" width="5" height="2.9" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="16" y1="19.05" x2="20.6" y2="19.05" stroke="#cfe0f0" stroke-width="0.5" stroke-opacity="0.75"/>
  </g>

  <!-- helmet (ACH) — focal head with headset boom mic -->
  <circle cx="25.4" cy="24" r="5.7" fill="url(#solUsJtac-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <path d="M21.2 20.6 a5.7 5.7 0 0 1 4.6 -1.9" fill="none" stroke="#cfd2a4" stroke-width="1.05" stroke-opacity="0.7" stroke-linecap="round"/>
  <rect x="30.3" y="22.9" width="2.5" height="2.3" rx="0.6" fill="#2b2920"/> <!-- NVG mount = front -->
  <path d="M27 27.6 q3 1 4.2 -0.6" fill="none" stroke="#2b2920" stroke-width="0.8" stroke-linecap="round"/> <!-- headset boom -->
</svg>
