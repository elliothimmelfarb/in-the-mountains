<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- HESCO bastion, straight run along +x. STATIC sprite: full NW light + SE cast
       shadow. anchor [0.5,0.62] (front-bottom of wall), footprint 1.5 m run x 1.0 m thick. -->
  <defs>
    <linearGradient id="hescoStraight-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6a472"/>
      <stop offset="1" stop-color="#9c8c5e"/>
    </linearGradient>
    <linearGradient id="hescoStraight-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c7c50"/>
      <stop offset="1" stop-color="#6e6140"/>
    </linearGradient>
    <filter id="hescoStraight-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- SE cast shadow -->
  <path d="M8 30 h33 l4 5 h-33z" fill="#1c160e" opacity="0.30" filter="url(#hescoStraight-soft)"/>

  <!-- front (SE) face, in shade -->
  <rect x="7" y="22" width="34" height="10" fill="url(#hescoStraight-face)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.55"/>
  <!-- gabion cell divisions on the face -->
  <g stroke="#564a2e" stroke-width="0.7" stroke-opacity="0.6">
    <line x1="16" y1="22" x2="16" y2="32"/><line x1="24" y1="22" x2="24" y2="32"/><line x1="32" y1="22" x2="32" y2="32"/>
  </g>
  <!-- wire mesh hint on the face -->
  <g stroke="#cdbb86" stroke-width="0.3" stroke-opacity="0.4">
    <line x1="7" y1="26" x2="41" y2="26"/><line x1="7" y1="29" x2="41" y2="29"/>
  </g>

  <!-- top face (gravel fill), NW lit -->
  <polygon points="7,22 41,22 44,16 10,16" fill="url(#hescoStraight-top)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- gravel speckle on top -->
  <g fill="#7e6f46" opacity="0.5">
    <circle cx="14" cy="19" r="0.7"/><circle cx="20" cy="20" r="0.6"/><circle cx="27" cy="18.6" r="0.7"/><circle cx="33" cy="19.6" r="0.6"/><circle cx="38" cy="18.4" r="0.6"/><circle cx="24" cy="19.4" r="0.5"/>
  </g>
  <!-- gabion cell tops -->
  <g stroke="#6f6038" stroke-width="0.6" stroke-opacity="0.7">
    <line x1="16" y1="22" x2="18.6" y2="16"/><line x1="24" y1="22" x2="26.6" y2="16"/><line x1="32" y1="22" x2="34.6" y2="16"/>
  </g>
  <!-- NW rim light along the top-back edge -->
  <line x1="10" y1="16" x2="44" y2="16" stroke="#efe3b6" stroke-width="0.9" stroke-opacity="0.65"/>

  <!-- a couple of sandbags on the parapet -->
  <g stroke-width="0.4">
    <ellipse cx="14" cy="16" rx="3" ry="1.7" fill="#b0a172" stroke="#7a6a44" stroke-width="0.4"/>
    <ellipse cx="20" cy="15.6" rx="3" ry="1.7" fill="#a89968" stroke="#7a6a44" stroke-width="0.4"/>
    <ellipse cx="30" cy="16" rx="3" ry="1.7" fill="#b0a172" stroke="#7a6a44" stroke-width="0.4"/>
    <ellipse cx="36" cy="15.6" rx="3" ry="1.7" fill="#a89968" stroke="#7a6a44" stroke-width="0.4"/>
  </g>
</svg>
