<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- CIV FARMER: earth robe, shouldering a hoe/mattock across the body.
       Top-down, facing +x. ROTATING: symmetric contact shadow + gentle top light.
       Tool carried DIAGONALLY (not axial). Shoulders widest axis, head forward. NO weapon. -->
  <defs>
    <radialGradient id="civFarmer-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#b89a6e"/>
      <stop offset="0.6" stop-color="#977a50"/>
      <stop offset="1" stop-color="#6a5234"/>
    </radialGradient>
    <radialGradient id="civFarmer-robe" cx="0.34" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#9c8a64"/>
      <stop offset="0.7" stop-color="#7a6e50"/>
      <stop offset="1" stop-color="#574d39"/>
    </radialGradient>
    <filter id="civFarmer-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="24.6" rx="9.8" ry="8.8" fill="#181308" opacity="0.30" filter="url(#civFarmer-soft)"/>

  <!-- trailing arm steadying low -->
  <path d="M22 28.4 q5 -0.4 8.4 2.4" fill="none" stroke="#736749" stroke-width="2.6" stroke-linecap="round"/>

  <!-- robe / torso: broad oval, widest across y -->
  <ellipse cx="22.4" cy="24" rx="7.1" ry="8.3" fill="url(#civFarmer-robe)" stroke="#241c12" stroke-width="0.85" stroke-opacity="0.6"/>
  <path d="M18.6 19.4 a7.1 8.3 0 0 0 -2.4 4.6" fill="none" stroke="#c8b890" stroke-width="0.9" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M22.4 16.2 q-1 7.8 0 15.6" fill="none" stroke="#534a37" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- lead arm up gripping the tool shaft -->
  <path d="M23 19.6 q6 0.5 10.5 5.4" fill="none" stroke="#736749" stroke-width="2.7" stroke-linecap="round"/>

  <!-- HOE / MATTOCK carried diagonally across the body: wooden shaft + iron head high-front -->
  <g stroke-linecap="round">
    <line x1="19" y1="30.6" x2="36.6" y2="18.6" stroke="#5a3f24" stroke-width="2.0"/>
    <line x1="19" y1="30.6" x2="36.6" y2="18.6" stroke="#7a5a38" stroke-width="0.9"/>
    <!-- mattock head at the high-front end -->
    <path d="M35 18.2 l4 -1.4 l1 2.2 l-3.8 2.1z" fill="#5a5446" stroke="#241c12" stroke-width="0.5"/>
    <path d="M35 18.2 l4 -1.4" stroke="#9a9384" stroke-width="0.5" stroke-opacity="0.6"/>
  </g>
  <!-- hands gripping shaft -->
  <circle cx="32.4" cy="24" r="1.1" fill="#977a50"/>
  <circle cx="30.4" cy="29.4" r="1.1" fill="#977a50"/>

  <!-- head with wrapped scarf/cap, forward (+x) -->
  <circle cx="26.8" cy="24" r="4.4" fill="url(#civFarmer-head)" stroke="#241c12" stroke-width="0.9"/>
  <path d="M23 22 a4.4 4.4 0 0 1 7.5 0.4" fill="none" stroke="#564631" stroke-width="1.3" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M23.5 21.6 a4.4 4.4 0 0 1 2.9 -1.3" fill="none" stroke="#d6c69e" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
