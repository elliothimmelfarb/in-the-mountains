<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- CIV WOMAN: fully-covered respectful silhouette in a muted blue/grey chador.
       Top-down, facing +x. ROTATING: symmetric contact shadow + gentle top light.
       Modest draped form ONLY — no facial/body detail, no kit. Distinct blue-grey hue
       sets her apart from earth-tone men. Smooth flowing silhouette. -->
  <defs>
    <radialGradient id="civWoman-chador" cx="0.34" cy="0.28" r="1.0">
      <stop offset="0" stop-color="#8c97a0"/>
      <stop offset="0.6" stop-color="#6e7a84"/>
      <stop offset="1" stop-color="#4e565e"/>
    </radialGradient>
    <filter id="civWoman-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="24.8" rx="9.6" ry="8.8" fill="#181308" opacity="0.30" filter="url(#civWoman-soft)"/>

  <!-- chador: one smooth draped teardrop form, broad at shoulders (y axis),
       tapering slightly toward the head end (+x). No limbs shown — fully covered. -->
  <path d="M16 24
           q0 -8 7.4 -8.4
           q4.4 -0.2 7.4 2.2
           q3.4 2.6 3.4 6.2
           q0 3.6 -3.4 6.2
           q-3 2.4 -7.4 2.2
           q-7.4 -0.4 -7.4 -8.4z"
        fill="url(#civWoman-chador)" stroke="#23272b" stroke-width="0.9" stroke-opacity="0.6"/>
  <!-- NW top-light crescent along the lit edge -->
  <path d="M18 19 q-2 2.4 -2 5" fill="none" stroke="#c2cad2" stroke-width="0.95" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- soft draping folds flowing back from the head -->
  <path d="M28 20.6 q-6 3.4 -10.4 2.6" fill="none" stroke="#454c52" stroke-width="0.6" stroke-opacity="0.45"/>
  <path d="M28 27.4 q-6 -3.4 -10.4 -2.6" fill="none" stroke="#454c52" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- covered head: a smooth rounded crown at the forward (+x) point, same fabric (no face) -->
  <ellipse cx="27.2" cy="24" rx="3.4" ry="3.8"
        fill="url(#civWoman-chador)" stroke="#23272b" stroke-width="0.85" stroke-opacity="0.55"/>
  <!-- subtle headscarf highlight along the NW lit edge of the crown -->
  <path d="M24.8 21.8 a3.4 3.8 0 0 1 2.6 -1.4" fill="none" stroke="#c2cad2" stroke-width="0.85" stroke-opacity="0.55" stroke-linecap="round"/>
</svg>
