<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 92">
  <!-- CH-47 CHINOOK, top-down, parked nose-UP (north). STATIC: full NW light + SE cast
       shadow. anchor [0.5,0.5], footprint 20 m (length). Tandem twin-rotor heavy lifter:
       long box fuselage, cockpit glass at nose, FRONT pylon + low rotor disc, REAR pylon
       (taller hump) + rear rotor disc, rear loading ramp, 4-wheel + nose gear. Bulkier than
       the Black Hawk; the two big overlapping discs are the signature read. -->
  <defs>
    <linearGradient id="heloCh47-body" x1="0.12" y1="0.08" x2="0.88" y2="0.95">
      <stop offset="0" stop-color="#6c7050"/>
      <stop offset="0.5" stop-color="#565a3d"/>
      <stop offset="1" stop-color="#3f432d"/>
    </linearGradient>
    <linearGradient id="heloCh47-pylon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#787c58"/>
      <stop offset="1" stop-color="#474b32"/>
    </linearGradient>
    <linearGradient id="heloCh47-glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8fa3ac"/>
      <stop offset="0.55" stop-color="#566a72"/>
      <stop offset="1" stop-color="#39474d"/>
    </linearGradient>
    <radialGradient id="heloCh47-disc" cx="0.42" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#d9d4bf" stop-opacity="0.04"/>
      <stop offset="0.62" stop-color="#cfcab3" stop-opacity="0.15"/>
      <stop offset="0.9" stop-color="#bdb89e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a8a386" stop-opacity="0.10"/>
    </radialGradient>
    <radialGradient id="heloCh47-hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#7d7c6e"/>
      <stop offset="0.6" stop-color="#45443a"/>
      <stop offset="1" stop-color="#26251e"/>
    </radialGradient>
    <filter id="heloCh47-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ===== SE cast shadow (whole airframe, offset down-right) ===== -->
  <g fill="#1c160e" opacity="0.30" filter="url(#heloCh47-soft)">
    <path d="M20.5 12.5 q5.5 -1 10 0.5 q3.8 1.5 4.1 6 l0.6 56 q-0.2 6 -2.2 8 l-12.4 0
             q-2 -2 -2.2 -8 l0.6 -56 q0.3 -5 3.7 -6.5z"/>
  </g>

  <!-- ===== MAIN FUSELAGE (long, WIDE box - heavy lifter bulk) ===== -->
  <path d="M27 11.5
           q6.4 0.3 7.4 5.8
           l0.6 6 0.5 16 0.4 18 0.2 14
           q-0.2 5.6 -1.6 7.6 l-1.4 1.6 -12.6 0 -1.4 -1.6 q-1.4 -2 -1.6 -7.6
           l0.2 -14 0.4 -18 0.5 -16 0.6 -6 q1 -5.5 7.4 -5.8z"
        fill="url(#heloCh47-body)" stroke="#1c160e" stroke-width="0.95" stroke-opacity="0.65"/>

  <!-- NW lit sliver (port / left flank) -->
  <path d="M18.7 20 l-0.5 14 -0.4 18 -0.2 14 q0.1 4.4 1.2 6.4"
        fill="none" stroke="#9d9d7a" stroke-width="1.3" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M20.4 16 q1.9 -3.9 6 -4.3"
        fill="none" stroke="#bcbb96" stroke-width="0.9" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- SE shaded flank (starboard / right) -->
  <path d="M35.3 20 l0.5 14 0.4 18 0.2 14 q-0.1 4.4 -1.2 6.4"
        fill="none" stroke="#33371f" stroke-width="1.8" stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- fuselage panel seams + sponson stripe (running the side fuel tanks) -->
  <g stroke="#33371f" stroke-width="0.45" stroke-opacity="0.5">
    <path d="M18.9 30 q8.1 1.5 16.2 0" fill="none"/>
    <path d="M18.5 44 q8.5 1.6 17 0" fill="none"/>
    <path d="M18.5 58 q8.5 1.6 17 0" fill="none"/>
    <path d="M19.2 70 q7.8 1.4 15.6 0" fill="none"/>
  </g>
  <!-- side fuel sponson seam (long horizontal run, both flanks) -->
  <g stroke="#33371f" stroke-width="0.5" stroke-opacity="0.45" fill="none">
    <path d="M19.2 36 l-0.5 24"/><path d="M34.8 36 l0.5 24"/>
  </g>

  <!-- ===== COCKPIT GLASS (nose) ===== -->
  <path d="M27 12 q5 0.3 5.8 4 q0.7 3.4 -0.5 6.4 q-5.3 1.5 -10.6 0 q-1.2 -3 -0.5 -6.4 q0.8 -3.7 5.8 -4z"
        fill="url(#heloCh47-glass)" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="27" y1="12.4" x2="27" y2="22" stroke="#262a26" stroke-width="0.7"/>
  <path d="M22.4 18.4 q4.6 1.2 9.2 0" fill="none" stroke="#262a26" stroke-width="0.5" stroke-opacity="0.8"/>
  <path d="M23 16 q2.8 -1.9 6 -1.5" fill="none" stroke="#dfe6e6" stroke-width="0.8" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- ===== REAR LOADING RAMP ===== -->
  <path d="M22 78 l10 0 q-0.6 4.2 -1.6 5.4 l-6.8 0 q-1 -1.2 -1.6 -5.4z"
        fill="#4b4f34" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="27" y1="78.4" x2="27" y2="83" stroke="#33371f" stroke-width="0.5" stroke-opacity="0.6"/>
  <path d="M23 79 q4 0.9 8 0" fill="none" stroke="#9a9a78" stroke-width="0.4" stroke-opacity="0.4"/>

  <!-- ===== LANDING GEAR ===== -->
  <!-- front L/R main gear sponsons + wheels -->
  <path d="M18.4 38 q-2.8 0.3 -3 2 q0.2 1.7 3 2 l1.4 -0.5 0 -3z" fill="#4d5135" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.6"/>
  <circle cx="16.5" cy="40" r="1.5" fill="#26251c" stroke="#1c160e" stroke-width="0.4"/>
  <path d="M35.6 38 q2.8 0.3 3 2 q-0.2 1.7 -3 2 l-1.4 -0.5 0 -3z" fill="#3c402a" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.6"/>
  <circle cx="37.5" cy="40" r="1.5" fill="#211f17" stroke="#1c160e" stroke-width="0.4"/>
  <!-- rear L/R main gear sponsons + wheels (third+fourth, set wider) -->
  <path d="M18.2 64 q-3 0.3 -3.2 2.1 q0.2 1.8 3.2 2.1 l1.5 -0.5 0 -3.2z" fill="#4d5135" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.6"/>
  <circle cx="16.2" cy="66.1" r="1.6" fill="#26251c" stroke="#1c160e" stroke-width="0.4"/>
  <path d="M35.8 64 q3 0.3 3.2 2.1 q-0.2 1.8 -3.2 2.1 l-1.5 -0.5 0 -3.2z" fill="#3c402a" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.6"/>
  <circle cx="37.8" cy="66.1" r="1.6" fill="#211f17" stroke="#1c160e" stroke-width="0.4"/>

  <!-- ===== FRONT ROTOR ASSEMBLY ===== -->
  <!-- front rotor disc -->
  <circle cx="27" cy="28" r="19" fill="url(#heloCh47-disc)"/>
  <circle cx="27" cy="28" r="19" fill="none" stroke="#d9d4bf" stroke-width="0.4" stroke-opacity="0.2"/>
  <g stroke="#9a9578" stroke-width="0.5" stroke-opacity="0.12" fill="none">
    <circle cx="27" cy="28" r="12"/><circle cx="27" cy="28" r="6.5"/>
  </g>
  <!-- front pylon (low forward hump) -->
  <path d="M23.4 23.5 q3.6 -1.4 7.2 0 l-0.4 5.4 q-3.2 1.2 -6.4 0z"
        fill="url(#heloCh47-pylon)" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="24" y1="24.2" x2="23.7" y2="28.4" stroke="#cfcaa6" stroke-width="0.5" stroke-opacity="0.5"/>
  <!-- front 3 blades (parked) inside disc -->
  <g stroke-linecap="round">
    <line x1="27" y1="28" x2="43" y2="22.5" stroke="#3a392d" stroke-width="1.3" stroke-opacity="0.5"/>
    <line x1="27" y1="28" x2="22" y2="44.5" stroke="#2a2920" stroke-width="1.3" stroke-opacity="0.5"/>
    <line x1="27" y1="28" x2="12" y2="20" stroke="#4c4b3d" stroke-width="1.3" stroke-opacity="0.5"/>
  </g>
  <circle cx="27" cy="28" r="3.0" fill="url(#heloCh47-hub)" stroke="#1c160e" stroke-width="0.7"/>
  <circle cx="27" cy="28" r="1.1" fill="#1d1c15"/>
  <circle cx="26" cy="27" r="0.8" fill="#cfcaa6" opacity="0.5"/>

  <!-- ===== REAR ROTOR ASSEMBLY (taller pylon hump, set back) ===== -->
  <!-- rear rotor disc -->
  <circle cx="27" cy="62" r="19" fill="url(#heloCh47-disc)"/>
  <circle cx="27" cy="62" r="19" fill="none" stroke="#d9d4bf" stroke-width="0.4" stroke-opacity="0.2"/>
  <g stroke="#9a9578" stroke-width="0.5" stroke-opacity="0.12" fill="none">
    <circle cx="27" cy="62" r="12"/><circle cx="27" cy="62" r="6.5"/>
  </g>
  <!-- rear pylon (tall aft hump - the Chinook's big rear stack) -->
  <path d="M22.6 55 q4.4 -1.8 8.8 0 l-0.6 9 q-3.8 1.5 -7.6 0z"
        fill="url(#heloCh47-pylon)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.65"/>
  <path d="M23.2 56 l-0.4 7.5" fill="none" stroke="#cfcaa6" stroke-width="0.6" stroke-opacity="0.55"/>
  <path d="M30.6 56 l0.4 7.5" fill="none" stroke="#33371f" stroke-width="0.9" stroke-opacity="0.55"/>
  <line x1="23.6" y1="59.5" x2="30.4" y2="59.5" stroke="#33371f" stroke-width="0.45" stroke-opacity="0.5"/>
  <!-- rear 3 blades (parked) inside disc -->
  <g stroke-linecap="round">
    <line x1="27" y1="62" x2="43" y2="67.5" stroke="#3a392d" stroke-width="1.3" stroke-opacity="0.5"/>
    <line x1="27" y1="62" x2="22" y2="45.5" stroke="#4c4b3d" stroke-width="1.3" stroke-opacity="0.5"/>
    <line x1="27" y1="62" x2="12" y2="70" stroke="#2a2920" stroke-width="1.3" stroke-opacity="0.5"/>
  </g>
  <circle cx="27" cy="62" r="3.2" fill="url(#heloCh47-hub)" stroke="#1c160e" stroke-width="0.7"/>
  <circle cx="27" cy="62" r="1.2" fill="#1d1c15"/>
  <circle cx="25.9" cy="61" r="0.85" fill="#cfcaa6" opacity="0.5"/>
</svg>
