<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Draw/re-entrant glyph: V notch / valley cut (contour V's pointing uphill = valley). FLAT milspec ink.
       footprint:null (screen-fixed), anchor [0.5,0.5], rotating:false. -->
  <defs>
    <filter id="markerDraw-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>
  <!-- dark keyline halo behind -->
  <g filter="url(#markerDraw-halo)" stroke="#0c0d0a" stroke-opacity="0.5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19 L12 11 L20 19"/>
    <path d="M5.5 14 L12 8 L18.5 14"/>
    <path d="M7 9 L12 5 L17 9"/>
    <line x1="12" y1="11" x2="12" y2="22"/>
  </g>
  <!-- ink: nested contour chevrons pointing UP (re-entrant), narrowing -->
  <g fill="none" stroke="#d8d6c4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19 L12 11 L20 19" stroke-width="1.8"/>
    <path d="M5.5 14 L12 8 L18.5 14" stroke-width="1.7" stroke-opacity="0.85"/>
    <path d="M7 9 L12 5 L17 9" stroke-width="1.6" stroke-opacity="0.7"/>
  </g>
  <!-- water-course/drainage line down the draw -->
  <line x1="12" y1="11" x2="12" y2="21.5" stroke="#e0a72b" stroke-width="1.4" stroke-linecap="round"/>
</svg>
