<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- bld-toc: Tactical Operations Center. STATIC, NW light + SE cast shadow.
       Rebuilt as a clearly EXTRUDED box read from above with a ~13deg tilt hint:
       a top/roof face, a lit NW wall sliver, a deep SE shadow wall band, a soft SE
       cast shadow grounding it. Identity: rooftop comms cluster (whip antennas +
       satcom dish) + small US flag mast. Near-square plan. anchor [0.5,0.82], footprint 10 m. -->
  <defs>
    <linearGradient id="bldToc-roof" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9b8e6a"/>
      <stop offset="0.55" stop-color="#897c59"/>
      <stop offset="1" stop-color="#736749"/>
    </linearGradient>
    <linearGradient id="bldToc-wallNW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a479"/>
      <stop offset="1" stop-color="#94865c"/>
    </linearGradient>
    <linearGradient id="bldToc-wallSE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e553b"/>
      <stop offset="1" stop-color="#473f2b"/>
    </linearGradient>
    <filter id="bldToc-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>

  <!-- SOFT SE CAST SHADOW on the ground (offset down-right) -->
  <path d="M16 47 h33 l8 9 h-33z" fill="#1c160e" opacity="0.37" filter="url(#bldToc-soft)"/>

  <!-- sandbag berm around the SE/lit base -->
  <g stroke="#7a6a44" stroke-width="0.4">
    <ellipse cx="16" cy="50.5" rx="3.0" ry="1.9" fill="#aa9b6c"/>
    <ellipse cx="22" cy="51.4" rx="3.0" ry="1.9" fill="#b0a172"/>
    <ellipse cx="28" cy="51.9" rx="3.0" ry="1.9" fill="#aa9b6c"/>
    <ellipse cx="34" cy="52.0" rx="3.0" ry="1.9" fill="#b0a172"/>
    <ellipse cx="40" cy="51.7" rx="3.0" ry="1.9" fill="#aa9b6c"/>
    <ellipse cx="46" cy="51.0" rx="3.0" ry="1.9" fill="#b0a172"/>
  </g>

  <!-- ===== EXTRUDED BOX ===== -->
  <!-- SE wall band (front, deep shade) - tall and clearly visible (~16% of height) -->
  <polygon points="17,40 49,40 49,49 17,49" fill="url(#bldToc-wallSE)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- NW wall sliver (left side, lit, catching the key light) -->
  <polygon points="13,30 17,33 17,49 13,46" fill="url(#bldToc-wallNW)" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.45"/>
  <!-- corrugation on the SE shadow wall -->
  <g stroke="#352f20" stroke-width="0.45" stroke-opacity="0.5">
    <line x1="23" y1="40.3" x2="23" y2="48.7"/><line x1="29" y1="40.3" x2="29" y2="48.7"/>
    <line x1="35" y1="40.3" x2="35" y2="48.7"/><line x1="41" y1="40.3" x2="41" y2="48.7"/>
  </g>
  <!-- door on the SE wall -->
  <rect x="37" y="42.5" width="5" height="6.5" fill="#3a3120" stroke="#241d12" stroke-width="0.4"/>
  <line x1="41.5" y1="43" x2="41.5" y2="48.6" stroke="#8a7c54" stroke-width="0.4" stroke-opacity="0.6"/>

  <!-- ROOF top face, NW lit. Sturdy near-square hut. -->
  <polygon points="13,30 53,30 49,40 17,40" fill="url(#bldToc-roof)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- roof panel seams running NW->SE -->
  <g stroke="#5b5236" stroke-width="0.5" stroke-opacity="0.55">
    <line x1="21" y1="30" x2="22" y2="40"/><line x1="29" y1="30" x2="29.4" y2="40"/>
    <line x1="37" y1="30" x2="36.8" y2="40"/><line x1="45" y1="30" x2="44.2" y2="40"/>
  </g>
  <!-- lengthwise ridge lines -->
  <g stroke="#a89a6c" stroke-width="0.4" stroke-opacity="0.4">
    <line x1="14.6" y1="33.5" x2="51.5" y2="33.5"/>
    <line x1="15.6" y1="37" x2="49.5" y2="37"/>
  </g>
  <!-- STRONG NW rim highlight on top-back/left roof edges -->
  <line x1="13" y1="30" x2="53" y2="30" stroke="#efe3b6" stroke-width="1.1" stroke-opacity="0.62"/>
  <line x1="13" y1="30" x2="17" y2="40" stroke="#efe3b6" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- SE roof edge stays dark -->
  <line x1="17" y1="40" x2="49" y2="40" stroke="#2c2618" stroke-width="0.7" stroke-opacity="0.5"/>

  <!-- ===== ROOFTOP COMMS CLUSTER (identity cue) ===== -->
  <!-- satcom dish, NW-lit, on a small stand -->
  <g>
    <ellipse cx="22.5" cy="37" rx="2.2" ry="1.2" fill="#473f2b" opacity="0.5" filter="url(#bldToc-soft)"/>
    <ellipse cx="22" cy="34.6" rx="3.7" ry="2.7" fill="#bcb089" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.55"/>
    <ellipse cx="22" cy="34.6" rx="2.2" ry="1.6" fill="#8f8463"/>
    <ellipse cx="21.2" cy="33.9" rx="1.2" ry="0.8" fill="#d4c9a0" opacity="0.7"/>
    <line x1="22" y1="34.6" x2="25" y2="32" stroke="#332d20" stroke-width="0.7"/>
    <circle cx="25.1" cy="31.9" r="0.7" fill="#241d12"/>
  </g>

  <!-- whip antennas: near-vertical with slight SE lean, casting short SE shadows on roof -->
  <g stroke-linecap="round">
    <g stroke="#473f2b" stroke-width="0.7" stroke-opacity="0.4">
      <line x1="34" y1="36.5" x2="36.5" y2="38"/>
      <line x1="38.5" y1="35.5" x2="41" y2="37.2"/>
      <line x1="42.5" y1="36.5" x2="44.6" y2="38"/>
    </g>
    <line x1="34" y1="36.5" x2="35.2" y2="18" stroke="#2c2618" stroke-width="0.9"/>
    <line x1="34" y1="36.5" x2="35.2" y2="18" stroke="#4a4231" stroke-width="0.35"/>
    <line x1="38.5" y1="35.5" x2="40" y2="13" stroke="#2c2618" stroke-width="1.0"/>
    <line x1="38.5" y1="35.5" x2="40" y2="13" stroke="#4a4231" stroke-width="0.4"/>
    <line x1="42.5" y1="36.5" x2="43.6" y2="20" stroke="#2c2618" stroke-width="0.9"/>
    <line x1="42.5" y1="36.5" x2="43.6" y2="20" stroke="#4a4231" stroke-width="0.35"/>
    <circle cx="35.2" cy="18" r="0.55" fill="#201c12"/>
    <circle cx="40" cy="13" r="0.55" fill="#201c12"/>
    <circle cx="43.6" cy="20" r="0.55" fill="#201c12"/>
  </g>

  <!-- small US flag on a mast -->
  <g>
    <line x1="47.5" y1="35" x2="49.8" y2="37" stroke="#473f2b" stroke-width="0.6" stroke-opacity="0.4"/>
    <line x1="47.5" y1="35" x2="48.4" y2="15.5" stroke="#332d20" stroke-width="0.95"/>
    <circle cx="48.4" cy="15.5" r="0.7" fill="#d8b94a"/>
    <rect x="48.4" y="16.5" width="3.0" height="1.4" fill="#2f5f93"/>
    <path d="M51.4 16.5 q3.4 -0.4 6 1 q-2.6 1.3 -6 1.1z" fill="#c4ccd6" stroke="#2f5f93" stroke-width="0.3"/>
    <line x1="48.6" y1="18.1" x2="57" y2="18.7" stroke="#9c2c20" stroke-width="0.5" stroke-opacity="0.85"/>
    <line x1="51.6" y1="17.2" x2="57" y2="17.6" stroke="#9c2c20" stroke-width="0.45" stroke-opacity="0.7"/>
  </g>
</svg>
