<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- POPLAR, tall slender, top-down. STATIC: small tight oval canopy, brighter green,
       reads as a thin tree. NW crescent + SE cast shadow. -->
  <defs>
    <radialGradient id="treePoplar-canopy" cx="0.40" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#7ba04a"/>
      <stop offset="0.5" stop-color="#5e8038"/>
      <stop offset="1" stop-color="#466030"/>
    </radialGradient>
    <filter id="treePoplar-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- SE cast shadow (narrow, the tree is thin) -->
  <ellipse cx="26" cy="30" rx="9" ry="8" fill="#1c160e" opacity="0.30" filter="url(#treePoplar-soft)"/>

  <!-- tight oval canopy -->
  <ellipse cx="24" cy="22" rx="9" ry="11" fill="url(#treePoplar-canopy)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.55"/>

  <!-- NW lit crescent -->
  <path d="M24 11 q-7 1 -8.5 9 q-0.6 3 0.5 5.5 q1.5 -8 8 -11 q1.8 -0.8 3.5 -0.8 q-1.4 -2.3 -3.5 -2.7z"
        fill="#8fb45a" opacity="0.82"/>
  <!-- NW rim highlight -->
  <path d="M18 15 q3 -3 6 -3.2" fill="none" stroke="#a8c66e" stroke-width="0.8" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- broken vertical leaf-column strokes (columnar poplar foliage) -->
  <g stroke="#4c6a30" stroke-width="0.55" stroke-opacity="0.5" stroke-linecap="round">
    <line x1="21.5" y1="15" x2="21.5" y2="20"/><line x1="22" y1="23" x2="22" y2="29"/>
    <line x1="26" y1="16" x2="26" y2="21"/><line x1="25.5" y1="24" x2="25.5" y2="28"/>
    <line x1="28.5" y1="19" x2="28.5" y2="26"/><line x1="19" y1="20" x2="19" y2="25"/>
  </g>
  <!-- small clump flecks for canopy texture -->
  <g opacity="0.45">
    <circle cx="20.5" cy="17.5" r="2" fill="#6e9046"/>
    <circle cx="27" cy="19" r="2.2" fill="#466030"/>
    <circle cx="23" cy="25" r="2.4" fill="#3e5a2c"/>
  </g>
  <!-- SE shadow side -->
  <path d="M30 18 q3 4 1 9 q-1.4 3.5 -4 4.5 q4 -6 1.5 -12 q1 -1 1.5 -1.5z" fill="#3a5228" opacity="0.5"/>
  <!-- small soft dark center -->
  <ellipse cx="23.5" cy="21.5" rx="1.3" ry="1.6" fill="#3a5228" opacity="0.55"/>
</svg>
