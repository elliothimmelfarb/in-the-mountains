<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48">
  <!-- FOOTBRIDGE: simple timber/rope footbridge over a stream. Planks + rails, small SE
       shadow on the water. STATIC, NW light. anchor [0.5,0.78], footprint 10 m.
       Bridge spans W->E across a stream running N-S. -->
  <defs>
    <linearGradient id="fb-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#456b78"/>
      <stop offset="1" stop-color="#345868"/>
    </linearGradient>
    <linearGradient id="fb-plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7848"/>
      <stop offset="1" stop-color="#735436"/>
    </linearGradient>
    <linearGradient id="fb-bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8a64"/>
      <stop offset="1" stop-color="#7c6c48"/>
    </linearGradient>
    <filter id="fb-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- STREAM running vertically (N-S) down the middle -->
  <path d="M22 0 h20 v48 H22z" fill="url(#fb-water)"/>
  <!-- ripple highlights on water -->
  <g stroke="#9fc4cc" stroke-width="0.5" stroke-opacity="0.45" fill="none">
    <path d="M24 8 q4 1.5 8 0 q4 -1.5 8 0"/>
    <path d="M24 40 q4 1.5 8 0 q4 -1.5 8 0"/>
    <path d="M25 44 q3 1.2 6 0"/>
  </g>
  <!-- banks (left/right earth edges) -->
  <path d="M0 0 h22 v48 H0z" fill="url(#fb-bank)"/>
  <path d="M42 0 h22 v48 H42z" fill="url(#fb-bank)"/>
  <!-- damp wet keyline along the waterline -->
  <line x1="22" y1="0" x2="22" y2="48" stroke="#2c3e44" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="42" y1="0" x2="42" y2="48" stroke="#2c3e44" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- reeds at the bank edges -->
  <g stroke="#6c7a42" stroke-width="0.6" stroke-opacity="0.6">
    <line x1="20" y1="10" x2="21" y2="6"/><line x1="44" y1="38" x2="45" y2="34"/><line x1="20" y1="42" x2="19" y2="38"/>
  </g>

  <!-- SE cast shadow of the bridge on the water (offset down-right) -->
  <path d="M11 27 h44 v3.5 h-44z" fill="#1c160e" opacity="0.30" filter="url(#fb-soft)"/>

  <!-- BRIDGE DECK spanning E-W across the stream -->
  <!-- under-shade sliver -->
  <rect x="9" y="24.5" width="46" height="3" fill="#5a4228" opacity="0.6"/>
  <!-- deck body -->
  <rect x="9" y="19" width="46" height="6" rx="0.6" fill="url(#fb-plank)" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.55"/>
  <!-- planks (cross battens) -->
  <g stroke="#5a4228" stroke-width="0.6" stroke-opacity="0.6">
    <line x1="13" y1="19" x2="13" y2="25"/><line x1="17" y1="19" x2="17" y2="25"/><line x1="21" y1="19" x2="21" y2="25"/>
    <line x1="25" y1="19" x2="25" y2="25"/><line x1="29" y1="19" x2="29" y2="25"/><line x1="33" y1="19" x2="33" y2="25"/>
    <line x1="37" y1="19" x2="37" y2="25"/><line x1="41" y1="19" x2="41" y2="25"/><line x1="45" y1="19" x2="45" y2="25"/>
    <line x1="49" y1="19" x2="49" y2="25"/><line x1="51.5" y1="19" x2="51.5" y2="25"/>
  </g>
  <!-- NW-lit top edge of the deck -->
  <line x1="9" y1="19" x2="55" y2="19" stroke="#d8b98a" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- RAILS (rope/timber) on the NW (top) side, posts casting tiny SE shadows -->
  <g>
    <line x1="9" y1="16" x2="55" y2="16" stroke="#7a5a38" stroke-width="1.3"/>
    <line x1="9" y1="16" x2="55" y2="16" stroke="#a8855a" stroke-width="0.5" stroke-opacity="0.7"/>
    <path d="M11 16 q6 2 12 0 q6 2 12 0 q6 2 12 0 q4 1.4 8 0" fill="none" stroke="#8a7048" stroke-width="0.6" stroke-opacity="0.7"/>
    <g stroke="#5a4228" stroke-width="1.2" stroke-linecap="round">
      <line x1="11" y1="19" x2="11" y2="15"/><line x1="23" y1="19" x2="23" y2="15"/>
      <line x1="35" y1="19" x2="35" y2="15"/><line x1="47" y1="19" x2="47" y2="15"/><line x1="53" y1="19" x2="53" y2="15"/>
    </g>
    <g stroke="#a8855a" stroke-width="0.4" stroke-opacity="0.7" stroke-linecap="round">
      <line x1="11" y1="18.5" x2="11" y2="15.5"/><line x1="23" y1="18.5" x2="23" y2="15.5"/>
      <line x1="35" y1="18.5" x2="35" y2="15.5"/><line x1="47" y1="18.5" x2="47" y2="15.5"/>
    </g>
  </g>

  <!-- bridge footings on each bank (stone abutments) -->
  <rect x="9" y="19" width="4" height="8" rx="0.6" fill="#8a8268" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="51" y="19" width="4" height="8" rx="0.6" fill="#7a7258" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.5"/>
</svg>
