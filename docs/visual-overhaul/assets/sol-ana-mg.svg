<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ANA MACHINE-GUNNER (PKM), top-down, facing +x (east). ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Heavier gunner build. PKM: LONG barrel + BIPOD at the muzzle + belt/ammo box.
       Woodland-mottle helmet, TEAL armband. Weapon carried diagonally, bipod legs splay at front. -->
  <defs>
    <radialGradient id="solAnaMg-helm" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#8c8b5a"/>
      <stop offset="0.6" stop-color="#5a5b3a"/>
      <stop offset="1" stop-color="#3e402a"/>
    </radialGradient>
    <linearGradient id="solAnaMg-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#75793f"/>
      <stop offset="1" stop-color="#43472a"/>
    </linearGradient>
    <filter id="solAnaMg-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (slightly larger - heavier kit) -->
  <ellipse cx="24" cy="25.2" rx="11.2" ry="10" fill="#181308" opacity="0.31" filter="url(#solAnaMg-soft)"/>

  <!-- shoulders / torso (broader gunner) -->
  <path d="M17.6 16.2
           q-3.2 0.4 -3.2 7.8 q0 7.4 3.2 7.8
           q6.1 0.7 11.2 -1.4 q2.7 -1.1 2.7 -6.4 q0 -5.3 -2.7 -6.4 q-5.1 -2.1 -11.2 -1.4z"
        fill="url(#solAnaMg-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>

  <!-- ammo box / belt pouch on hip (gunner cue) -->
  <rect x="18.4" y="26.6" width="4.6" height="3.4" rx="0.6" fill="#43452c" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.7"/>

  <!-- chest rig -->
  <path d="M21.2 19.8 q3.4 4 0 8" fill="none" stroke="#3f4128" stroke-width="1.7" stroke-opacity="0.85"/>

  <!-- shoulder caps -->
  <ellipse cx="19.3" cy="18.2" rx="3.4" ry="2.5" fill="#62643f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.3" cy="29.8" rx="3.4" ry="2.5" fill="#62643f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- arms cradling the long gun -->
  <path d="M21.3 19.4 q7.5 1.4 13.5 7" fill="none" stroke="#54562f" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M22 29 q6.8 -0.6 11.2 2.6" fill="none" stroke="#54562f" stroke-width="2.9" stroke-linecap="round"/>

  <!-- weapon: PKM — long barrel diagonal across body, belt feeding from receiver, BIPOD at muzzle -->
  <g stroke-linecap="round">
    <!-- receiver + long barrel -->
    <line x1="18.8" y1="31" x2="41.5" y2="18.8" stroke="#241c11" stroke-width="2.6"/>
    <line x1="18.8" y1="31" x2="41.5" y2="18.8" stroke="#4a4233" stroke-width="0.9"/>
    <!-- ammo belt hanging from receiver -->
    <path d="M24.5 28 q-1.6 2.4 -3.2 2.6" fill="none" stroke="#7a5a30" stroke-width="1.4" stroke-opacity="0.9"/>
    <!-- bipod legs splayed at the muzzle (front) -->
    <line x1="40.4" y1="19.4" x2="43.4" y2="16.4" stroke="#1d1a12" stroke-width="1.1"/>
    <line x1="40.4" y1="19.4" x2="43.6" y2="20.6" stroke="#1d1a12" stroke-width="1.1"/>
    <circle cx="41.6" cy="18.7" r="0.9" fill="#141310"/> <!-- muzzle -->
  </g>

  <!-- faction accent: TEAL armband + trim -->
  <g transform="rotate(-20 18 18.5)">
    <rect x="15.3" y="16.8" width="5.0" height="3.0" rx="0.6" fill="#6fae9f" stroke="#1f3a33" stroke-width="0.4"/>
    <line x1="15.5" y1="18.3" x2="20.1" y2="18.3" stroke="#bfe2d9" stroke-width="0.5" stroke-opacity="0.8"/>
  </g>

  <!-- helmet — woodland mottle, NW light -->
  <circle cx="25.2" cy="23.8" r="5.7" fill="url(#solAnaMg-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <path d="M23.2 20.8 q1.6 -0.5 2.4 0.9 q-1.1 1.2 -2.6 0.6 z" fill="#3f4126" fill-opacity="0.7"/>
  <path d="M26.4 25 q1.5 0.2 1.4 1.6 q-1.4 0.5 -2.1 -0.6 z" fill="#3f4126" fill-opacity="0.7"/>
  <path d="M22.8 25.4 q1.1 0.3 0.9 1.4 q-1.2 0.3 -1.6 -0.7 z" fill="#6a6c42" fill-opacity="0.6"/>
  <!-- TEAL helmet scrim band — rotation-invariant faction accent -->
  <circle cx="25.2" cy="23.8" r="4.1" fill="none" stroke="#6fae9f" stroke-width="1.3" stroke-opacity="0.95"/>
  <path d="M21.2 20.5 a5.7 5.7 0 0 1 4.5 -1.8" fill="none" stroke="#d2d4a6" stroke-width="1.0" stroke-opacity="0.7" stroke-linecap="round"/>
</svg>
