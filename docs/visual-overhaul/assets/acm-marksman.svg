<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ACM MARKSMAN, top-down, facing +x. ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Lean man-dress (shalwar kameez) fighter, pakol cap, red scarf accent.
       SVD-style long sniper rifle carried diagonally across the body (low-ready),
       with a scope block + long thin barrel. NO helmet. -->
  <defs>
    <radialGradient id="acmMarksman-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#9a7e58"/>
      <stop offset="0.6" stop-color="#6e5a3c"/>
      <stop offset="1" stop-color="#4c3d28"/>
    </radialGradient>
    <linearGradient id="acmMarksman-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9c8a66"/>
      <stop offset="1" stop-color="#6c5f44"/>
    </linearGradient>
    <filter id="acmMarksman-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="11.5" ry="9.5" fill="#181308" opacity="0.30" filter="url(#acmMarksman-soft)"/>

  <!-- torso/shoulders: lean, widest across y (perpendicular to facing) -->
  <path d="M18.5 18 q-3 0.4 -3 6 q0 5.6 3 6
           q5.4 0.6 9.8 -1.2 q2.4 -1 2.4 -4.8 q0 -3.8 -2.4 -4.8 q-4.4 -1.8 -9.8 -1.2z"
        fill="url(#acmMarksman-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <!-- shoulder caps -->
  <ellipse cx="19.6" cy="19.6" rx="2.9" ry="2.2" fill="#7d6e4f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.4"/>
  <ellipse cx="19.6" cy="28.4" rx="2.9" ry="2.2" fill="#7d6e4f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- arms cradling the long rifle diagonally -->
  <path d="M21.5 20.4 q9 1.6 16 6.4" fill="none" stroke="#7a6c4d" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M22 27.6 q7 -0.2 11.5 2.4" fill="none" stroke="#7a6c4d" stroke-width="2.6" stroke-linecap="round"/>

  <!-- weapon: SVD long sniper rifle, diagonal (butt low-rear, long thin barrel high-front).
       Thick receiver/stock end, then a notably LONG thin barrel to sell the sniper read. -->
  <g stroke-linecap="round">
    <!-- receiver + stock (thicker rear half) -->
    <line x1="17.0" y1="30.8" x2="31" y2="23.9" stroke="#171510" stroke-width="2.3"/>
    <line x1="17.0" y1="30.8" x2="31" y2="23.9" stroke="#3a382c" stroke-width="0.9"/>
    <!-- long thin barrel (front half) reaching well past the figure -->
    <line x1="31" y1="23.9" x2="44.5" y2="17.2" stroke="#171510" stroke-width="1.4"/>
    <line x1="31" y1="23.9" x2="44.5" y2="17.2" stroke="#34322a" stroke-width="0.6"/>
    <!-- scope block over the receiver -->
    <line x1="26.4" y1="26.2" x2="30.6" y2="24.1" stroke="#13110d" stroke-width="3.2"/>
    <circle cx="30.6" cy="24.1" r="0.8" fill="#9bb0b8" opacity="0.6"/> <!-- scope glass -->
    <!-- magazine -->
    <line x1="27.0" y1="28.8" x2="29.2" y2="24.4" stroke="#1b1912" stroke-width="2.0"/>
    <!-- muzzle tip -->
    <circle cx="44.6" cy="17.1" r="0.8" fill="#121008"/>
  </g>

  <!-- faction accent: red scarf/armband -->
  <ellipse cx="19.4" cy="24" rx="2.0" ry="3.4" fill="#c0392b" stroke="#6e1c14" stroke-width="0.4"/>
  <path d="M17.8 21.3 q-1 2.7 0 5.4" fill="none" stroke="#8a2d22" stroke-width="0.7" stroke-opacity="0.8"/>

  <!-- head: pakol cap (focal, slightly forward), NW top light, NO helmet -->
  <circle cx="25.6" cy="24" r="4.7" fill="url(#acmMarksman-head)" stroke="#1c160e" stroke-width="0.9"/>
  <path d="M22.1 21.1 a4.7 4.7 0 0 1 3.6 -1.5" fill="none" stroke="#c8b68e" stroke-width="0.95" stroke-opacity="0.65" stroke-linecap="round"/>
  <!-- pakol roll rim -->
  <circle cx="25.6" cy="24" r="4.7" fill="none" stroke="#5a4a30" stroke-width="1.1" stroke-opacity="0.55"/>
</svg>
