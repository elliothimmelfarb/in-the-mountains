<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Visual-sighting glyph: eye outline. FLAT milspec ink, rust/orange.
       footprint:null (screen-fixed), anchor [0.5,0.5], rotating:false. -->
  <defs>
    <filter id="markerIntelVisual-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>
  <!-- dark keyline halo behind -->
  <g filter="url(#markerIntelVisual-halo)" stroke="#0c0d0a" stroke-opacity="0.5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 12 C6.5 6.6 17.5 6.6 20.6 12 C17.5 17.4 6.5 17.4 3.4 12 Z"/>
    <circle cx="12" cy="12" r="3"/>
    <path d="M5.6 7.2 L3.8 5.6 M18.4 7.2 L20.2 5.6 M5.6 16.8 L3.8 18.4 M18.4 16.8 L20.2 18.4"/>
  </g>
  <!-- rust eye almond -->
  <path d="M3.4 12 C6.5 6.6 17.5 6.6 20.6 12 C17.5 17.4 6.5 17.4 3.4 12 Z"
        fill="none" stroke="#b5532a" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- iris + pupil -->
  <circle cx="12" cy="12" r="3" fill="none" stroke="#b5532a" stroke-width="1.6"/>
  <circle cx="12" cy="12" r="1.15" fill="#b5532a"/>
  <!-- sighting/glint ticks -->
  <g stroke="#b5532a" stroke-width="1.5" stroke-linecap="round">
    <path d="M5.7 7.4 L4.2 6.1 M18.3 7.4 L19.8 6.1 M5.7 16.6 L4.2 17.9 M18.3 16.6 L19.8 17.9"/>
  </g>
</svg>
