<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 36">
  <!-- Toyota Hilux-style pickup (ANA/local "technical"), top-down, facing +x (east).
       ROTATING sprite: symmetric centered contact shadow. Cab + open bed, civilian read.
       footprint 5 m (length). anchor center [0.5,0.5]. -->
  <defs>
    <linearGradient id="vehPickup-cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e0cf"/>
      <stop offset="0.5" stop-color="#d4ccb6"/>
      <stop offset="1" stop-color="#b8b095"/>
    </linearGradient>
    <linearGradient id="vehPickup-hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece6d6"/>
      <stop offset="1" stop-color="#c4bba1"/>
    </linearGradient>
    <linearGradient id="vehPickup-bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0a98f"/>
      <stop offset="1" stop-color="#8f886f"/>
    </linearGradient>
    <radialGradient id="vehPickup-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1c160e" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#1c160e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1c160e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="29" cy="18" rx="23" ry="11" fill="url(#vehPickup-shadow)"/>

  <!-- four wheels at corners -->
  <g fill="#2a251a" stroke="#161109" stroke-width="0.55">
    <rect x="13" y="5.5" width="7" height="4.8" rx="1.8"/>
    <rect x="13" y="25.7" width="7" height="4.8" rx="1.8"/>
    <rect x="35" y="5.5" width="7" height="4.8" rx="1.8"/>
    <rect x="35" y="25.7" width="7" height="4.8" rx="1.8"/>
  </g>

  <!-- chassis / body base -->
  <rect x="11" y="11" width="34" height="14" rx="1.4" fill="#8f886f" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>

  <!-- open cargo BED (rear, west) - recessed, with bed-rail walls -->
  <rect x="12.5" y="11.5" width="15" height="13" rx="1" fill="url(#vehPickup-bed)" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.5"/>
  <!-- bed floor ribs -->
  <g stroke="#6e6850" stroke-width="0.5" stroke-opacity="0.6">
    <line x1="16" y1="12.5" x2="16" y2="23.5"/>
    <line x1="20" y1="12.5" x2="20" y2="23.5"/>
    <line x1="24" y1="12.5" x2="24" y2="23.5"/>
  </g>
  <!-- tailgate (rear edge) -->
  <rect x="11.5" y="11.5" width="1.6" height="13" rx="0.5" fill="#a39c82"/>

  <!-- CAB (front-center) -->
  <rect x="28" y="11.5" width="11" height="13" rx="1.4" fill="url(#vehPickup-cab)" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.5"/>
  <!-- windshield (front edge of cab) + rear window -->
  <rect x="36.5" y="13" width="2.2" height="10" rx="0.6" fill="#5e6b6a" opacity="0.7"/>
  <rect x="28.6" y="13" width="1.8" height="10" rx="0.6" fill="#6a7068" opacity="0.6"/>
  <!-- roof seam -->
  <line x1="33" y1="12" x2="33" y2="24" stroke="#b8b095" stroke-width="0.5" stroke-opacity="0.7"/>

  <!-- short hood (front, east) -->
  <path d="M39 12 L46 14.5 L46 21.5 L39 24 Z" fill="url(#vehPickup-hood)" stroke="#1c160e" stroke-width="0.6" stroke-opacity="0.5"/>
  <!-- grille tip / bumper -->
  <path d="M46 16 L48 18 L46 20" fill="none" stroke="#2f2a1d" stroke-width="0.8" stroke-opacity="0.65"/>
  <!-- headlight dots -->
  <g fill="#d8cfb2"><circle cx="45" cy="15.5" r="0.7"/><circle cx="45" cy="20.5" r="0.7"/></g>
  <!-- side mirrors -->
  <g fill="#2f2a1d"><rect x="38.5" y="10.4" width="2" height="1.1" rx="0.4"/><rect x="38.5" y="24.5" width="2" height="1.1" rx="0.4"/></g>

  <!-- mounted weapon hint in bed (a "technical" - PKM on a post), forward-facing -->
  <circle cx="20" cy="18" r="1.6" fill="#3c352a" stroke="#161109" stroke-width="0.4"/>
  <rect x="20" y="17.3" width="10" height="1.3" rx="0.5" fill="#2f2a1d" stroke="#161109" stroke-width="0.25"/>

  <!-- NW rim light on lit upper edges -->
  <path d="M11 11 L45 11" fill="none" stroke="#fbf4dc" stroke-width="0.6" stroke-opacity="0.45"/>
  <path d="M39 12 L46 14.5" fill="none" stroke="#fbf4dc" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="28.4" y1="11.8" x2="38.6" y2="11.8" stroke="#fbf4dc" stroke-width="0.5" stroke-opacity="0.5"/>
</svg>
