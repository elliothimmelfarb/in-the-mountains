<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- ico-cerp-mosque: dome + minaret with crescent, subtle green accent. -->
  <g fill="none" stroke="#d8d6c4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- main dome -->
    <path d="M5.6 13.4 C5.6 9.6 8 7.4 10.8 7.4 C13.6 7.4 16 9.6 16 13.4"/>
    <!-- dome base / building body -->
    <path d="M5.6 13.4 L5.6 20 L16 20 L16 13.4"/>
    <!-- arched doorway -->
    <path d="M9 20 L9 16.4 C9 15.4 12.6 15.4 12.6 16.4 L12.6 20"/>
    <!-- minaret tower -->
    <path d="M18.8 20 L18.8 9.6 L20.6 9.6 L20.6 20"/>
    <!-- minaret cap -->
    <path d="M18.4 9.6 L19.7 7.8 L21 9.6"/>
  </g>
  <!-- finial/crescent on dome (subtle green accent) -->
  <path d="M10.8 7.4 L10.8 4.6" stroke="#4f7a52" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12.2 4 C11 3.6 9.8 4.4 9.8 5.6 C9.8 6.8 11 7.4 12.2 7 C11.4 6.6 11.4 4.4 12.2 4 Z" fill="#4f7a52"/>
</svg>
