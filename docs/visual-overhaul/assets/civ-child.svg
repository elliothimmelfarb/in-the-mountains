<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- CIV CHILD: SMALLER figure (footprint ~0.9 m), simple tunic, lively stance.
       Top-down, facing +x. ROTATING: symmetric contact shadow + gentle top light.
       Drawn smaller within the box (head proportionally bigger = childlike). NO kit. -->
  <defs>
    <radialGradient id="civChild-head" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#bb9c6e"/>
      <stop offset="0.6" stop-color="#9a7c50"/>
      <stop offset="1" stop-color="#6f5536"/>
    </radialGradient>
    <radialGradient id="civChild-tunic" cx="0.34" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#b2a07c"/>
      <stop offset="0.7" stop-color="#8c7c5c"/>
      <stop offset="1" stop-color="#675c43"/>
    </radialGradient>
    <filter id="civChild-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (small) -->
  <ellipse cx="24" cy="24.6" rx="6.4" ry="5.8" fill="#181308" opacity="0.30" filter="url(#civChild-soft)"/>

  <!-- lively arms: one swung forward, one back (motion) -->
  <path d="M23.4 21.2 q3.8 -0.4 6 1.8" fill="none" stroke="#7e7053" stroke-width="2.0" stroke-linecap="round"/>
  <path d="M23.4 27 q3.4 0.4 5.4 -1.4" fill="none" stroke="#7e7053" stroke-width="2.0" stroke-linecap="round"/>
  <circle cx="29.6" cy="23.2" r="0.9" fill="#9a7c50"/>
  <circle cx="29" cy="25.4" r="0.9" fill="#9a7c50"/>

  <!-- small tunic torso: compact oval, widest across y -->
  <ellipse cx="22.8" cy="24" rx="4.6" ry="5.6" fill="url(#civChild-tunic)" stroke="#241c12" stroke-width="0.75" stroke-opacity="0.6"/>
  <path d="M20.4 20.6 a4.6 5.6 0 0 0 -1.6 3.2" fill="none" stroke="#d2c39d" stroke-width="0.75" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- head: proportionally larger (childlike), forward (+x), little cap -->
  <circle cx="26.4" cy="24" r="3.9" fill="url(#civChild-head)" stroke="#241c12" stroke-width="0.85"/>
  <path d="M23.2 23.6 a3.9 3.9 0 0 1 7.4 -0.8" fill="none" stroke="#5a4a32" stroke-width="1.1" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M23.6 22 a3.9 3.9 0 0 1 2.6 -1.1" fill="none" stroke="#dccba2" stroke-width="0.8" stroke-opacity="0.65" stroke-linecap="round"/>
</svg>
