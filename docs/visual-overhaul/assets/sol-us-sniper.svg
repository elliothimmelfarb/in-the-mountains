<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US SNIPER, top-down, facing +x. ROTATING.
       Distinct from marksman: a LONG precision rifle with a BIG long scope; leaner/lower
       profile (narrower shoulders, steadier/kneeling read). Muffled/boonie head, no NVG. -->
  <defs>
    <radialGradient id="solUsSniper-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#7e7c52"/>
      <stop offset="0.6" stop-color="#56542f"/>
      <stop offset="1" stop-color="#3a3920"/>
    </radialGradient>
    <linearGradient id="solUsSniper-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6c6e4a"/>
      <stop offset="1" stop-color="#3e402a"/>
    </linearGradient>
    <filter id="solUsSniper-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25" rx="11.5" ry="8.6" fill="#181308" opacity="0.30" filter="url(#solUsSniper-soft)"/>

  <!-- leaner torso: narrower across y (lower profile), slightly elongated along x -->
  <path d="M19 18
           q-3.4 0.5 -3.4 6 q0 5.5 3.4 6
           q6.5 0.7 11.5 -1.2 q2.4 -0.95 2.4 -4.8 q0 -3.85 -2.4 -4.8 q-5 -1.9 -11.5 -1.2z"
        fill="url(#solUsSniper-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <ellipse cx="20.2" cy="19.6" rx="3" ry="2.1" fill="#585a39" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="20.2" cy="28.4" rx="3" ry="2.1" fill="#585a39" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- ghillie/drape hints (a few deliberate strokes) -->
  <path d="M22 16.6 l1.2 2.2 M25.4 16.2 l1 2.3 M28.6 16.6 l0.9 2.2" stroke="#5a5c3a" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- arms steadying the rifle diagonally; second hand far forward on the stock -->
  <path d="M22 20.4 q8 1.2 16 5.4" fill="none" stroke="#4a4c30" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M22.5 26.8 q7 -0.4 12.5 2.2" fill="none" stroke="#4a4c30" stroke-width="2.8" stroke-linecap="round"/>

  <!-- weapon: long precision rifle, diagonal low-ready; long barrel + big scope -->
  <g stroke-linecap="round">
    <line x1="18.4" y1="29.6" x2="45" y2="17.4" stroke="#1d1b15" stroke-width="2.4"/>
    <line x1="18.4" y1="29.6" x2="45" y2="17.4" stroke="#37352a" stroke-width="0.95"/>
    <line x1="27.2" y1="27.6" x2="29.4" y2="22.8" stroke="#201e17" stroke-width="2.0"/> <!-- magazine -->
    <!-- BIG long scope on top of receiver -->
    <rect x="27.5" y="21" width="8.4" height="2.9" rx="1.0" fill="#23211a" stroke="#0f0e0a" stroke-width="0.4"
          transform="rotate(-25 31.7 22.4)"/>
    <circle cx="35.4" cy="19.6" r="1.15" fill="#3f525d"/> <!-- objective lens -->
    <circle cx="28.4" cy="23.0" r="0.85" fill="#2a3940"/> <!-- ocular lens -->
    <line x1="45" y1="17.4" x2="45.6" y2="17.1" stroke="#141310" stroke-width="1.2"/> <!-- muzzle brake -->
    <!-- bipod hint at the foregrip -->
    <path d="M39 21.2 l-1.4 2.4 M39.8 21.6 l1 2.6" stroke="#1d1b15" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- faction accent: US-blue IR flag on rear-left shoulder (smaller, leaner) -->
  <g transform="rotate(-20 19 19.5)">
    <rect x="16.4" y="18" width="4.6" height="2.7" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="16.6" y1="19.35" x2="20.7" y2="19.35" stroke="#cfe0f0" stroke-width="0.45" stroke-opacity="0.75"/>
  </g>

  <!-- head: boonie/soft cap (no helmet dome highlight crescent, flatter) -->
  <circle cx="25.8" cy="23.4" r="5.1" fill="url(#solUsSniper-head)" stroke="#1c160e" stroke-width="0.9"/>
  <path d="M22 20.4 a5.1 5.1 0 0 1 4 -1.6" fill="none" stroke="#c4c79c" stroke-width="0.85" stroke-opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="29.6" cy="22.8" rx="1.3" ry="1.0" fill="#34331f"/> <!-- cheek weld / brim front -->
</svg>
