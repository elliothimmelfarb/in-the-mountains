<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- ico-cerp-wall: terraced retaining wall, stacked-stone courses stepping down a slope. -->
  <g fill="none" stroke="#d8d6c4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- upper terrace block (a 2-course stone wall) -->
    <rect x="3.4" y="5.2" width="9.2" height="5.6" rx="0.6"/>
    <!-- coursing on upper block: mid line + offset verticals (running bond) -->
    <path d="M3.4 8 L12.6 8"/>
    <path d="M6.4 5.2 L6.4 8 M9.6 5.2 L9.6 8 M5 8 L5 10.8 M8 8 L8 10.8 M11 8 L11 10.8"/>
    <!-- lower terrace block, stepped down and to the right -->
    <rect x="10.4" y="13.4" width="10.2" height="5.6" rx="0.6"/>
    <path d="M10.4 16.2 L20.6 16.2"/>
    <path d="M13.4 13.4 L13.4 16.2 M16.6 13.4 L16.6 16.2 M12 16.2 L12 19 M15 16.2 L15 19 M18 16.2 L18 19"/>
  </g>
  <!-- amber cap stone marking the finished course -->
  <path d="M3.4 5.2 L12.6 5.2" stroke="#e0a72b" stroke-width="1.7" stroke-linecap="round"/>
</svg>
