<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ACM MACHINE GUNNER (PKM), top-down, facing +x. ROTATING: symmetric contact shadow +
       rotation-tolerant top light. anchor [0.5,0.5], footprint 1.4 m.
       Earth-tone man-dress, ROUND turban head, red armband accent. PKM: long heavy
       barrel diagonal, folded BIPOD at the muzzle, draped ammo BELT to the receiver. -->
  <defs>
    <radialGradient id="acmMg-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#b6a274"/>
      <stop offset="0.6" stop-color="#8c7a52"/>
      <stop offset="1" stop-color="#5e5036"/>
    </radialGradient>
    <linearGradient id="acmMg-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#a48c60"/>
      <stop offset="1" stop-color="#6a5838"/>
    </linearGradient>
    <linearGradient id="acmMg-barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e3a2c"/>
      <stop offset="1" stop-color="#191712"/>
    </linearGradient>
    <filter id="acmMg-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25" rx="10.8" ry="9.5" fill="#181308" opacity="0.30" filter="url(#acmMg-soft)"/>

  <!-- torso / man-dress -->
  <path d="M18.5 17.6
           q-3 0.5 -3 6.4 q0 5.9 3 6.4
           q5.6 0.8 10 -1.1 q2.3 -1 2.3 -5.3 q0 -4.3 -2.3 -5.3 q-4.4 -1.9 -10 -1.1z"
        fill="url(#acmMg-body)" stroke="#1c160e" stroke-width="0.85" stroke-opacity="0.6"/>
  <g stroke="#564730" stroke-width="0.45" stroke-opacity="0.5" fill="none">
    <path d="M20 20 q3 4 0 8"/>
  </g>
  <!-- shoulder caps -->
  <ellipse cx="20" cy="19.2" rx="3" ry="2.2" fill="#86714c" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.4"/>
  <ellipse cx="20" cy="28.8" rx="3" ry="2.2" fill="#86714c" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.4"/>
  <!-- red armband accent (bold, on the rear shoulder where it stays visible) -->
  <path d="M18.4 27.2 q1.7 0.8 1.7 2 q0 1.2 -1.7 2" fill="none" stroke="#c0392b" stroke-width="1.9" stroke-linecap="round"/>

  <!-- ammo belt draped from receiver hanging down (brass hint) -->
  <path d="M25.6 27.4 q-1.6 3 -4 4.2" fill="none" stroke="#7c5e2e" stroke-width="1.8" stroke-opacity="0.85"/>
  <g fill="#b89a52" opacity="0.8">
    <circle cx="25" cy="29" r="0.5"/><circle cx="24.1" cy="30.2" r="0.5"/><circle cx="22.9" cy="31.1" r="0.5"/>
  </g>

  <!-- arms supporting the heavy gun diagonally -->
  <path d="M21.8 20.4 q6.6 1.3 11.6 6.6" fill="none" stroke="#7a673f" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M22.4 28 q6 -0.6 10 2.6" fill="none" stroke="#7a673f" stroke-width="2.8" stroke-linecap="round"/>

  <!-- weapon: PKM, long heavy barrel diagonal -->
  <g stroke-linecap="round">
    <!-- buttstock -->
    <line x1="18.6" y1="31.4" x2="22" y2="29.4" stroke="#3a2c1c" stroke-width="2.6"/>
    <!-- receiver + long barrel -->
    <line x1="20.4" y1="30.6" x2="40.5" y2="19.4" stroke="#1c160e" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="20.4" y1="30.6" x2="40.5" y2="19.4" stroke="url(#acmMg-barrel)" stroke-width="2.1"/>
    <!-- folded bipod splayed at the muzzle (two clear legs) -->
    <line x1="39.4" y1="20" x2="42.8" y2="23.4" stroke="#241f16" stroke-width="1.3"/>
    <line x1="39.4" y1="20" x2="43.4" y2="17.4" stroke="#241f16" stroke-width="1.3"/>
    <!-- muzzle -->
    <circle cx="40.6" cy="19.3" r="0.9" fill="#141310"/>
  </g>

  <!-- head: ROUND turban, focal & forward -->
  <circle cx="25.6" cy="24" r="5.5" fill="url(#acmMg-head)" stroke="#1c160e" stroke-width="0.9"/>
  <g stroke="#5e5036" stroke-width="0.6" stroke-opacity="0.6" fill="none">
    <path d="M20.7 22.4 a5.5 5.5 0 0 1 9.2 -0.6"/>
    <path d="M20.5 25.6 a5.5 5.5 0 0 0 9.6 0.8"/>
  </g>
  <path d="M21.6 20.8 a5.5 5.5 0 0 1 4.3 -1.8" fill="none" stroke="#efe3b6" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
