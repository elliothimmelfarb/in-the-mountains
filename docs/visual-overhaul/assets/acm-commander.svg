<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ACM COMMANDER, top-down, facing +x. ROTATING: symmetric contact shadow +
       rotation-tolerant top light. anchor [0.5,0.5], footprint 1.4 m.
       Most-equipped fighter: man-dress + a full CHEST RIG, ICOM RADIO at the head,
       BINOCULARS held up as the authority cue, red command scarf. ROUND pakol head. -->
  <defs>
    <radialGradient id="acmCmd-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#b6a274"/>
      <stop offset="0.6" stop-color="#8c7a52"/>
      <stop offset="1" stop-color="#5e5036"/>
    </radialGradient>
    <linearGradient id="acmCmd-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9a8a64"/>
      <stop offset="1" stop-color="#62543a"/>
    </linearGradient>
    <linearGradient id="acmCmd-rig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c5236"/>
      <stop offset="1" stop-color="#3c3522"/>
    </linearGradient>
    <filter id="acmCmd-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25" rx="10.8" ry="9.6" fill="#181308" opacity="0.30" filter="url(#acmCmd-soft)"/>

  <!-- torso / man-dress, fuller shoulders (commander stance) -->
  <path d="M18 17.2
           q-3.2 0.5 -3.2 6.8 q0 6.3 3.2 6.8
           q5.8 0.8 10.4 -1.2 q2.4 -1 2.4 -5.6 q0 -4.6 -2.4 -5.6 q-4.6 -2 -10.4 -1.2z"
        fill="url(#acmCmd-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <!-- shoulder caps -->
  <ellipse cx="19.6" cy="18.8" rx="3.2" ry="2.3" fill="#7e6f4a" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.4"/>
  <ellipse cx="19.6" cy="29.2" rx="3.2" ry="2.3" fill="#7e6f4a" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.4"/>

  <!-- full chest rig: crossing straps + a row of mag pouches -->
  <g>
    <path d="M20.4 19.6 q5 2.2 6.6 4.4" fill="none" stroke="url(#acmCmd-rig)" stroke-width="1.8"/>
    <path d="M20.4 28.4 q5 -2.2 6.6 -4.4" fill="none" stroke="url(#acmCmd-rig)" stroke-width="1.8"/>
    <rect x="23.4" y="22.6" width="2.3" height="2.8" rx="0.4" fill="#4e4329" stroke="#1c160e" stroke-width="0.3" stroke-opacity="0.5"/>
    <rect x="20.6" y="22.6" width="2.3" height="2.8" rx="0.4" fill="#5a4d30" stroke="#1c160e" stroke-width="0.3" stroke-opacity="0.5"/>
  </g>
  <!-- red command scarf across the chest (authority accent) -->
  <path d="M19.6 21 q4.6 1.6 6.2 2.8" fill="none" stroke="#c0392b" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M18.2 16.8 q-2.6 -0.4 -4 1.2" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- back arm relaxed at the rear -->
  <path d="M20.4 28.6 q4.4 0.4 7 2.4" fill="none" stroke="#6f6040" stroke-width="2.7" stroke-linecap="round"/>

  <!-- forward arm RAISED holding binoculars to the eye line (authority cue) -->
  <path d="M22.4 22 q5.4 0.2 7.6 1.8" fill="none" stroke="#7d6c46" stroke-width="2.8" stroke-linecap="round"/>

  <!-- AK slung low-rear so he reads armed but optics-forward -->
  <line x1="17" y1="30.6" x2="23" y2="27.2" stroke="#241f16" stroke-width="2.2" stroke-linecap="round"/>

  <!-- head: ROUND pakol, focal & forward -->
  <circle cx="25.2" cy="24" r="5.6" fill="url(#acmCmd-head)" stroke="#1c160e" stroke-width="0.95"/>
  <!-- pakol rolled-brim ring -->
  <circle cx="25.2" cy="24" r="5.6" fill="none" stroke="#6a5a3c" stroke-width="1" stroke-opacity="0.55"/>
  <path d="M21.2 20.6 a5.6 5.6 0 0 1 4.4 -1.8" fill="none" stroke="#efe3b6" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- binoculars: ONE clear bridged double-barrel projecting forward from the eyes -->
  <g>
    <rect x="30.2" y="21.7" width="3.6" height="2.0" rx="0.7" fill="#2c281c" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.65"/>
    <rect x="30.2" y="24.3" width="3.6" height="2.0" rx="0.7" fill="#34301f" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.65"/>
    <rect x="29.6" y="23.4" width="1.4" height="1.2" rx="0.3" fill="#241f16"/> <!-- bridge -->
    <circle cx="33.6" cy="22.7" r="0.75" fill="#11100b"/>
    <circle cx="33.6" cy="25.3" r="0.75" fill="#11100b"/>
  </g>

  <!-- ICOM radio: ONE clean antenna whip off the rear shoulder (command comms) -->
  <line x1="18.8" y1="20.4" x2="14.6" y2="13.8" stroke="#1c160e" stroke-width="1" stroke-linecap="round"/>
  <circle cx="14.6" cy="13.8" r="0.85" fill="#2c281c"/>
  <rect x="18" y="19.4" width="2.4" height="3" rx="0.5" fill="#34301f" stroke="#1c160e" stroke-width="0.35" stroke-opacity="0.55"/>
</svg>
