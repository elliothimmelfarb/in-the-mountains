<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Named PEAK glyph: sharp summit caret with a tiny height tick. FLAT milspec ink.
       footprint:null (screen-fixed), anchor [0.5,0.85], rotating:false. -->
  <defs>
    <filter id="markerPeak-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>
  <!-- dark keyline halo behind -->
  <g filter="url(#markerPeak-halo)" stroke="#0c0d0a" stroke-opacity="0.5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19 L12 4 L20 19"/>
    <path d="M12 4 L12 1.2 M12 2.2 L14.6 2.2"/>
    <path d="M9.3 13.2 L12 8.2 L14.7 13.2"/>
  </g>
  <!-- ink summit triangle (open base = mountain) -->
  <path d="M4 19 L12 4 L20 19" fill="none" stroke="#d8d6c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- inner snow/rock crease, NW lit side hint -->
  <path d="M9.3 13.2 L12 8.2 L14.7 13.2" fill="none" stroke="#d8d6c4" stroke-width="1.4" stroke-opacity="0.7" stroke-linejoin="round"/>
  <!-- height tick: spot-elevation flag at the summit -->
  <g stroke="#e0a72b" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="12" y1="4" x2="12" y2="1.1"/>
    <path d="M12 1.5 L14.9 2.4 L12 3.3"/>
  </g>
</svg>
