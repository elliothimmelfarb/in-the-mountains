<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- INTERPRETER ("terp"), top-down, facing +x (east). ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Reads as OURS but NON-UNIFORMED: civilian earth jacket, BALL CAP (no helmet), no chest rig,
       small US-BLUE ID tag on the shoulder + lanyard ID badge on the chest. Unarmed (no long gun);
       only a holstered pistol hint on the hip. Slighter build than the soldiers. -->
  <defs>
    <radialGradient id="solInterp-cap" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#a08a5e"/>
      <stop offset="0.6" stop-color="#7a6644"/>
      <stop offset="1" stop-color="#574730"/>
    </radialGradient>
    <linearGradient id="solInterp-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9a8460"/>
      <stop offset="1" stop-color="#6c5a3e"/>
    </linearGradient>
    <filter id="solInterp-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (slighter footprint than a soldier) -->
  <ellipse cx="24" cy="25.2" rx="9.4" ry="8.6" fill="#181308" opacity="0.29" filter="url(#solInterp-soft)"/>

  <!-- shoulders / torso: earth civilian jacket, narrower than soldiers (no armor bulk) -->
  <path d="M19 18
           q-2.6 0.4 -2.6 6 q0 5.6 2.6 6
           q5 0.7 9.2 -1.1 q2.2 -1 2.2 -4.9 q0 -3.9 -2.2 -4.9 q-4.2 -1.8 -9.2 -1.1z"
        fill="url(#solInterp-body)" stroke="#1c160e" stroke-width="0.85" stroke-opacity="0.6"/>

  <!-- jacket front zip line -->
  <line x1="22.2" y1="21.4" x2="22.2" y2="26.6" stroke="#574730" stroke-width="0.8" stroke-opacity="0.7"/>

  <!-- ID badge on a lanyard (chest) — neutral card, marks "credentialed/ours" -->
  <line x1="21" y1="20.4" x2="23.4" y2="24.2" stroke="#d8d6c4" stroke-width="0.5" stroke-opacity="0.7"/>
  <rect x="22.4" y="23.8" width="2.6" height="3.0" rx="0.4" fill="#cfcdb8" stroke="#1c160e" stroke-width="0.4" stroke-opacity="0.6"/>
  <line x1="22.8" y1="24.6" x2="24.6" y2="24.6" stroke="#4a86c6" stroke-width="0.6"/> <!-- blue stripe on badge -->

  <!-- shoulder caps (soft, no hard pads) -->
  <ellipse cx="20.4" cy="19.6" rx="2.7" ry="2.1" fill="#7a684a" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.4"/>
  <ellipse cx="20.4" cy="28.4" rx="2.7" ry="2.1" fill="#7a684a" stroke="#1c160e" stroke-width="0.45" stroke-opacity="0.4"/>

  <!-- arms relaxed at sides (NOT cradling a weapon) -->
  <path d="M22 20.6 q4.8 0.4 7.8 2.4" fill="none" stroke="#6e5c40" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M22 27.4 q4.8 -0.4 7.8 -2.4" fill="none" stroke="#6e5c40" stroke-width="2.7" stroke-linecap="round"/>

  <!-- holstered pistol on the hip (small dark wedge — pistol only, low threat) -->
  <path d="M19.4 28.2 q1.8 0.4 1.6 2.4 q-1.8 0.5 -2.4 -0.8 z" fill="#2a2419" stroke="#1c160e" stroke-width="0.4" stroke-opacity="0.6"/>

  <!-- faction accent: small US-BLUE ID tag/patch on the rear shoulder ("ours, non-uniformed") -->
  <g transform="rotate(-18 19 20)">
    <rect x="16.6" y="18.6" width="4.4" height="2.7" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="16.8" y1="19.9" x2="20.8" y2="19.9" stroke="#cfe0f0" stroke-width="0.45" stroke-opacity="0.8"/>
  </g>

  <!-- ball cap — focal head, soft civilian crown with a short bill forward (+x). NO helmet. -->
  <circle cx="25.6" cy="24" r="4.9" fill="url(#solInterp-cap)" stroke="#1c160e" stroke-width="0.9"/>
  <!-- bill pointing forward -->
  <path d="M30 22.6 q2.7 0.4 2.8 1.4 q-0.1 1.0 -2.8 1.4 z" fill="#6a563a" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.65"/>
  <!-- cap seam + button -->
  <path d="M21.4 22.4 a4.9 4.9 0 0 1 8.2 0" fill="none" stroke="#574730" stroke-width="0.5" stroke-opacity="0.6"/>
  <circle cx="25.6" cy="24" r="0.6" fill="#574730"/>
  <!-- NW top-light -->
  <path d="M22 21.2 a4.9 4.9 0 0 1 3.9 -1.6" fill="none" stroke="#ecdfb8" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
</svg>
