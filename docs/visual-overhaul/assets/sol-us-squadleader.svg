<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US SQUAD LEADER, top-down, facing +x. ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Based on sol-us-rifleman: same body/helmet/shadow/weapon. Role cues:
       short radio antenna whip off the back-left + extra pouches + a raised pointing
       arm/hand (authority read). -->
  <defs>
    <radialGradient id="solUsSquadleader-helm" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#868a52"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#3c4028"/>
    </radialGradient>
    <linearGradient id="solUsSquadleader-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#454830"/>
    </linearGradient>
    <filter id="solUsSquadleader-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="11.5" ry="10" fill="#181308" opacity="0.30" filter="url(#solUsSquadleader-soft)"/>

  <!-- antenna whip arcing off the back-left (rear = -x side) -->
  <path d="M16 19 q-6 -3 -8.5 -7.5" fill="none" stroke="#23211a" stroke-width="0.9" stroke-linecap="round"/>
  <circle cx="7.4" cy="11.3" r="0.9" fill="#2b2920"/>

  <!-- shoulders / torso -->
  <path d="M18 16.5
           q-3.2 0.4 -3.2 7.5 q0 7.1 3.2 7.5
           q6 0.7 11 -1.4 q2.6 -1.1 2.6 -6.1 q0 -5 -2.6 -6.1 q-5 -2.1 -11 -1.4z"
        fill="url(#solUsSquadleader-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <!-- shoulder caps -->
  <ellipse cx="19.5" cy="18.4" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.5" cy="29.6" rx="3.4" ry="2.5" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <!-- extra pouches on the back (rank/leader cue: heavier kit) -->
  <rect x="15.6" y="21.4" width="2.6" height="2.2" rx="0.5" fill="#4d5132" stroke="#1c160e" stroke-width="0.4" stroke-opacity="0.5"/>
  <rect x="15.6" y="24.4" width="2.6" height="2.2" rx="0.5" fill="#4d5132" stroke="#1c160e" stroke-width="0.4" stroke-opacity="0.5"/>

  <!-- arms: rear arm cradles weapon; FRONT arm raised/pointing forward (authority gesture) -->
  <path d="M22 28.8 q6.5 -0.6 11 3" fill="none" stroke="#4d5132" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M21.5 19.6 q7 -1.1 13.4 -2.6" fill="none" stroke="#4d5132" stroke-width="3.0" stroke-linecap="round"/>
  <!-- raised pointing hand (extended off the front arm: directing the squad) -->
  <ellipse cx="35.2" cy="16.7" rx="2.0" ry="1.5" fill="#6b6f48" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.55"/>
  <path d="M34 15.8 a5.7 5.7 0 0 1 1.9 -0.2" fill="none" stroke="#cfd2a4" stroke-width="0.7" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- weapon: M4 carried diagonally (lower than rifleman since front arm is up) -->
  <g stroke-linecap="round">
    <line x1="19.5" y1="30.5" x2="38" y2="22" stroke="#1d1b15" stroke-width="2.5"/>
    <line x1="19.5" y1="30.5" x2="38" y2="22" stroke="#3a382c" stroke-width="1.0"/>
    <line x1="27" y1="29.4" x2="29.4" y2="25" stroke="#201e17" stroke-width="2.2"/>
    <circle cx="38.1" cy="21.9" r="1.0" fill="#141310"/>
  </g>

  <!-- faction accent: US-blue IR flag on the rear-left shoulder + nav stripe -->
  <g transform="rotate(-22 18 19)">
    <rect x="15.5" y="17.3" width="5.2" height="3" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="15.7" y1="18.8" x2="20.5" y2="18.8" stroke="#cfe0f0" stroke-width="0.5" stroke-opacity="0.75"/>
  </g>

  <!-- helmet (ACH) — focal head, NW top-light + NVG mount front. Leader: thin tan rank tab on top -->
  <circle cx="25.4" cy="24" r="5.7" fill="url(#solUsSquadleader-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <path d="M21.2 20.6 a5.7 5.7 0 0 1 4.6 -1.9" fill="none" stroke="#cfd2a4" stroke-width="1.05" stroke-opacity="0.7" stroke-linecap="round"/>
  <rect x="23.6" y="22.5" width="3.6" height="1.9" rx="0.4" fill="#c2a878" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.7"/> <!-- rank/IR leader tab on helmet top -->
  <line x1="24.3" y1="23.45" x2="26.5" y2="23.45" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.55"/>
  <rect x="30.3" y="22.9" width="2.5" height="2.3" rx="0.6" fill="#2b2920"/>
</svg>
