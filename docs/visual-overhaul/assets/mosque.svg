<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <!-- VILLAGE MOSQUE: rectangular prayer hall + small dome + slender minaret casting a
       long thin SE shadow + walled forecourt. Green trim on dome/door. STATIC, NW light.
       anchor [0.5,0.82], footprint 14 m. -->
  <defs>
    <linearGradient id="mosque-roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6905f"/>
      <stop offset="1" stop-color="#856d44"/>
    </linearGradient>
    <linearGradient id="mosque-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b59a6c"/>
      <stop offset="1" stop-color="#8c6a46"/>
    </linearGradient>
    <radialGradient id="mosque-dome" cx="0.36" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#7ba07c"/>
      <stop offset="0.55" stop-color="#557e58"/>
      <stop offset="1" stop-color="#3a5d3e"/>
    </radialGradient>
    <linearGradient id="mosque-court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a89274"/>
      <stop offset="1" stop-color="#8e795c"/>
    </linearGradient>
    <filter id="mosque-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- SE cast shadow of the whole compound -->
  <path d="M14 56 h40 l5 5 h-40z" fill="#1c160e" opacity="0.30" filter="url(#mosque-soft)"/>
  <!-- long thin minaret shadow sweeping SE across the forecourt floor -->
  <path d="M23 26 L46 53 L49.5 52.4 L25.6 25 z" fill="#1c160e" opacity="0.28" filter="url(#mosque-soft)"/>

  <!-- walled forecourt (courtyard floor) -->
  <rect x="13" y="22" width="44" height="34" rx="1.5" fill="url(#mosque-court)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.5"/>
  <!-- forecourt perimeter wall: NW-lit top edge, SE shade -->
  <rect x="13" y="22" width="44" height="34" rx="1.5" fill="none" stroke="#c2a87c" stroke-width="1.4" stroke-opacity="0.55"/>
  <rect x="14.4" y="23.4" width="41.2" height="31.2" rx="1" fill="none" stroke="#6e5736" stroke-width="0.8" stroke-opacity="0.4"/>
  <!-- worn paving lines toward the prayer hall -->
  <g stroke="#7c684a" stroke-width="0.5" stroke-opacity="0.4">
    <line x1="22" y1="50" x2="28" y2="42"/><line x1="30" y1="52" x2="33" y2="43"/><line x1="40" y1="51" x2="37" y2="43"/>
  </g>

  <!-- prayer hall body (the building) -->
  <rect x="22" y="26" width="28" height="20" rx="1" fill="url(#mosque-wall)" stroke="#1c160e" stroke-width="1" stroke-opacity="0.6"/>
  <!-- NW-lit wall sliver (top + left), SE shade sliver (bottom + right) -->
  <path d="M22 26 h28 v2.4 h-28z" fill="#c7ac7c" opacity="0.55"/>
  <path d="M22 26 v20 h2.2 v-20z" fill="#c7ac7c" opacity="0.4"/>
  <path d="M22 43.6 h28 v2.4 h-28z" fill="#6e5736" opacity="0.5"/>
  <path d="M47.8 26 h2.2 v20 h-2.2z" fill="#6e5736" opacity="0.45"/>

  <!-- flat earth roof of the hall with seams -->
  <rect x="24.4" y="28.4" width="23.4" height="15.2" fill="url(#mosque-roof)" stroke="#6e5736" stroke-width="0.5" stroke-opacity="0.5"/>
  <g stroke="#7c6444" stroke-width="0.4" stroke-opacity="0.5">
    <line x1="24.4" y1="33.5" x2="47.8" y2="33.5"/><line x1="24.4" y1="38.5" x2="47.8" y2="38.5"/>
    <line x1="36" y1="28.4" x2="36" y2="43.6"/>
  </g>

  <!-- DOME on the prayer hall (centered on the roof, green) -->
  <ellipse cx="36.3" cy="37" rx="6.6" ry="6.2" fill="#2c3a2c" opacity="0.35" filter="url(#mosque-soft)"/>
  <circle cx="35.6" cy="36" r="6.1" fill="url(#mosque-dome)" stroke="#2c402f" stroke-width="0.8"/>
  <!-- dome ribs (green, NW-lit) -->
  <g stroke="#3f6244" stroke-width="0.5" stroke-opacity="0.7" fill="none">
    <path d="M35.6 29.9 q-4.2 6.1 0 12.2"/><path d="M35.6 29.9 q4.2 6.1 0 12.2"/>
    <path d="M29.5 36 q6.1 -3 12.2 0"/>
  </g>
  <!-- drum ring at the dome base -->
  <ellipse cx="35.6" cy="40.6" rx="6" ry="1.7" fill="none" stroke="#3f6244" stroke-width="0.6" stroke-opacity="0.6"/>
  <!-- NW rim light on the dome -->
  <path d="M31.4 32.4 a6.1 6.1 0 0 1 5.2 -2.2" fill="none" stroke="#dfe8c8" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- finial -->
  <line x1="35.6" y1="30.2" x2="35.6" y2="27.6" stroke="#3f6244" stroke-width="0.9"/>
  <circle cx="35.6" cy="27.2" r="1" fill="#4f7a52" stroke="#2c402f" stroke-width="0.3"/>

  <!-- MINARET tower (slender circular stone shaft at the NW corner of the hall). Reads as a
       tower from above: outer shaft ring + inner shaft + balcony gallery + green cupola cap. -->
  <!-- tower base contact shade -->
  <ellipse cx="24.6" cy="25.4" rx="3.4" ry="3.2" fill="#2c241a" opacity="0.32" filter="url(#mosque-soft)"/>
  <!-- shaft outer ring (stone) -->
  <circle cx="23.8" cy="24.4" r="3.2" fill="url(#mosque-wall)" stroke="#1c160e" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- balcony gallery ring (the muezzin's gallery, reads as a tower) -->
  <circle cx="23.8" cy="24.4" r="2.4" fill="none" stroke="#6e5736" stroke-width="0.7" stroke-opacity="0.7"/>
  <!-- inner shaft -->
  <circle cx="23.8" cy="24.4" r="1.7" fill="#b59a6c" stroke="#6e5736" stroke-width="0.4"/>
  <!-- green cupola cap -->
  <circle cx="23.4" cy="24" r="1.1" fill="#557e58" stroke="#2c402f" stroke-width="0.4"/>
  <!-- NW-lit crescent highlight on the shaft -->
  <path d="M21.1 22.8 a3.2 3.2 0 0 1 3.2 -1.4" fill="none" stroke="#e2cfa2" stroke-width="0.9" stroke-opacity="0.8" stroke-linecap="round"/>
  <!-- crescent finial atop the cupola -->
  <path d="M22.9 24 a1 1 0 1 0 1.1 -0.95 a0.8 0.8 0 1 1 -1.1 0.95z" fill="#dfe8c8" opacity="0.9"/>

  <!-- arched DOORWAY with green trim, facing into forecourt (south side of hall) -->
  <path d="M33 46 v-3.4 a3 3 0 0 1 6 0 V46z" fill="#4a3a26" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.5"/>
  <path d="M33 46 v-3.4 a3 3 0 0 1 6 0 V46" fill="none" stroke="#4f7a52" stroke-width="1" stroke-opacity="0.9"/>
  <!-- forecourt gate gap (south wall) with green posts -->
  <rect x="32" y="55" width="6" height="1.8" fill="#8e795c"/>
  <line x1="32" y1="54.6" x2="32" y2="56.8" stroke="#4f7a52" stroke-width="0.9"/>
  <line x1="38" y1="54.6" x2="38" y2="56.8" stroke="#4f7a52" stroke-width="0.9"/>
</svg>
