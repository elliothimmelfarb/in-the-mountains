<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- CIV VILLAGER: generic adult, brown/grey shalwar kameez, empty-handed.
       Top-down, facing +x. ROTATING: symmetric contact shadow + gentle top light.
       Shoulders = widest axis (y). Head smaller, pushed forward as focal point.
       NO military kit, NO chest rig, NO weapon. -->
  <defs>
    <radialGradient id="civVillager-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#b89a6e"/>
      <stop offset="0.6" stop-color="#9a7c52"/>
      <stop offset="1" stop-color="#6f5638"/>
    </radialGradient>
    <radialGradient id="civVillager-robe" cx="0.34" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#aa9b7f"/>
      <stop offset="0.7" stop-color="#857a60"/>
      <stop offset="1" stop-color="#5f5644"/>
    </radialGradient>
    <filter id="civVillager-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="24.6" rx="9.4" ry="8.6" fill="#181308" opacity="0.30" filter="url(#civVillager-soft)"/>

  <!-- arms at sides, relaxed (empty-handed) -->
  <path d="M22 19.4 q5.6 0.6 8.6 3.4" fill="none" stroke="#7a6e55" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M22 28.6 q5.6 -0.6 8.6 -3.4" fill="none" stroke="#7a6e55" stroke-width="2.7" stroke-linecap="round"/>
  <circle cx="30.8" cy="22.4" r="1.1" fill="#9a7c52"/>
  <circle cx="30.8" cy="25.6" r="1.1" fill="#9a7c52"/>

  <!-- draped robe / torso: a broad OVAL, widest across y (shoulder axis) -->
  <ellipse cx="22.4" cy="24" rx="7" ry="8.2" fill="url(#civVillager-robe)" stroke="#241c12" stroke-width="0.85" stroke-opacity="0.6"/>
  <!-- NW top-light crescent on robe -->
  <path d="M18.6 19.4 a7 8.2 0 0 0 -2.4 4.6" fill="none" stroke="#cdbf9c" stroke-width="0.9" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- center robe fold -->
  <path d="M22.4 16.4 q-1 7.6 0 15.2" fill="none" stroke="#5a5240" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- head with simple wrapped cap / turban (no helmet), pushed forward (+x) -->
  <circle cx="27" cy="24" r="4.5" fill="url(#civVillager-head)" stroke="#241c12" stroke-width="0.9"/>
  <!-- turban wrap suggestion -->
  <path d="M23.2 22 a4.5 4.5 0 0 1 7.6 0.5" fill="none" stroke="#5a4a32" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M23 24 a4.5 4.5 0 0 0 8 1" fill="none" stroke="#5a4a32" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- NW highlight on head -->
  <path d="M23.6 21.6 a4.5 4.5 0 0 1 3 -1.3" fill="none" stroke="#d8c8a2" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
