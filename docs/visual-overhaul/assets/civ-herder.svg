<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- CIV HERDER: lean robe figure with a long thin herding staff held diagonally.
       Top-down, facing +x. ROTATING: symmetric contact shadow + gentle top light.
       Leaner (narrower torso) than villager; plain wood staff (NOT a weapon). -->
  <defs>
    <radialGradient id="civHerder-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#b69868"/>
      <stop offset="0.6" stop-color="#94774d"/>
      <stop offset="1" stop-color="#684f32"/>
    </radialGradient>
    <radialGradient id="civHerder-robe" cx="0.34" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#9a8c72"/>
      <stop offset="0.7" stop-color="#766b51"/>
      <stop offset="1" stop-color="#544c39"/>
    </radialGradient>
    <filter id="civHerder-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (smaller — lean) -->
  <ellipse cx="24" cy="24.6" rx="8.6" ry="7.8" fill="#181308" opacity="0.30" filter="url(#civHerder-soft)"/>

  <!-- trailing arm low -->
  <path d="M22.5 27.4 q4.4 -0.4 7.4 1.8" fill="none" stroke="#706546" stroke-width="2.3" stroke-linecap="round"/>

  <!-- lean robe / torso: a slimmer oval (narrower in x than villager), widest across y -->
  <ellipse cx="22.6" cy="24" rx="6" ry="7.4" fill="url(#civHerder-robe)" stroke="#241c12" stroke-width="0.82" stroke-opacity="0.6"/>
  <path d="M19.4 19.8 a6 7.4 0 0 0 -2 4" fill="none" stroke="#cabb96" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M22.6 17 q-0.9 7 0 14" fill="none" stroke="#504838" stroke-width="0.55" stroke-opacity="0.4"/>

  <!-- lead arm up gripping the staff -->
  <path d="M23 20.4 q5.6 0.5 9.8 4.4" fill="none" stroke="#706546" stroke-width="2.4" stroke-linecap="round"/>

  <!-- HERDING STAFF: long thin wooden pole, diagonal across body -->
  <line x1="16.5" y1="32" x2="39.5" y2="14.8" stroke="#5c4327" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16.5" y1="32" x2="39.5" y2="14.8" stroke="#86663e" stroke-width="0.6" stroke-linecap="round"/>
  <!-- slight crook at the top end -->
  <path d="M39.5 14.8 q1.6 -0.6 1.2 1.4" fill="none" stroke="#5c4327" stroke-width="1.4" stroke-linecap="round"/>
  <!-- hands gripping -->
  <circle cx="31.8" cy="24" r="1.0" fill="#94774d"/>
  <circle cx="30" cy="28.4" r="1.0" fill="#94774d"/>

  <!-- head: pakol-ish flat cap, forward (+x) -->
  <circle cx="26.6" cy="23.6" r="4.2" fill="url(#civHerder-head)" stroke="#241c12" stroke-width="0.9"/>
  <path d="M22.6 23.6 a4.2 4.2 0 0 1 8.2 -1" fill="none" stroke="#564631" stroke-width="1.3" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M23.4 21.4 a4.2 4.2 0 0 1 2.8 -1.2" fill="none" stroke="#d4c49c" stroke-width="0.8" stroke-opacity="0.6" stroke-linecap="round"/>
</svg>
