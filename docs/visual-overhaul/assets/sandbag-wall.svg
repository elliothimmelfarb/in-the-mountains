      <stop offset="0" stop-color="#a89868"/><stop offset="1" stop-color="#85774c"/>
    </linearGradient>
    <filter id="sandbagWall-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>
  <path d="M6 28 h48 l4 4 h-48 z" fill="#1c160e" opacity="0.32" filter="url(#sandbagWall-soft)"/>
