<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36">
  <!-- Sandbag blast wall: a straight run of stacked sandbags, ~4 offset courses, running along +x.
       Rounded bags, NW-lit crowns top-left, shaded bellies lower-right; brick-style offset courses. -->
