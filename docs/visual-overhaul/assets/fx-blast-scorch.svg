<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- BLAST SCORCH / CRATER decal. Flat top-down ground STAIN left by a mortar/IED
       detonation. NOT a lit object -> NO directional shadow, no rim light. Dirty &
       asymmetric so it reads as scorched earth, not a logo. anchor [0.5,0.5],
       footprint 6 m, family fx-decals, rotating false. -->
  <defs>
    <radialGradient id="fxBlastScorch-soot" cx="0.45" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#1c160e"/>
      <stop offset="0.42" stop-color="#211a10"/>
      <stop offset="0.78" stop-color="#332618"/>
      <stop offset="1" stop-color="#3a2c1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fxBlastScorch-dirt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a5a36" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#8a5a36" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#8a5a36" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6e4528" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1) rust-scuffed dirty earth halo: ONE broken irregular ring of kicked-up dirt,
        clipped to an organic lopsided blob so it never reads as a clean annulus. -->
  <clipPath id="fxBlastScorch-clip">
    <path d="M24 5
             C33 4.5 40 8 42 16
             C43.5 23 41 31 34 38
             C27 44 16 43.5 10 37
             C4.5 31 4 21 9 14
             C13 8 18 5.5 24 5Z"/>
  </clipPath>
  <g clip-path="url(#fxBlastScorch-clip)">
    <circle cx="23.5" cy="23.5" r="20" fill="url(#fxBlastScorch-dirt)"/>
    <!-- a couple of dirtier scuffs breaking the ring (asymmetric) -->
    <path d="M9 14 C13 9 19 7 25 7" fill="none" stroke="#6e4528" stroke-width="2.4" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M40 30 C37 36 31 40 25 41" fill="none" stroke="#6e4528" stroke-width="2.0" stroke-opacity="0.38" stroke-linecap="round"/>
  </g>

  <!-- 2) irregular sooty edge: charred outer scorch, lobed & lopsided -->
  <path d="M25 9
           C32 9 37.5 12.5 38 19
           C38.5 25 35 31 28.5 35.5
           C22.5 39.5 14 39 10.5 32
           C7.5 26 8.5 18 14 13.5
           C17.5 10.5 21 9 25 9Z"
        fill="#3a2c1e" fill-opacity="0.7"/>

  <!-- 3) charred dark center: soft soot falloff, lumpy & off-center (down-left) -->
  <path d="M24 12.5
           C31 12 35 16.5 34.5 22.5
           C34 28.5 30.5 33.5 24 35.5
           C18 37.5 12.5 33.5 11.5 27
           C10.5 21 13 15.5 18 13.5
           C20 12.8 21.5 12.7 24 12.5Z"
        fill="url(#fxBlastScorch-soot)"/>
  <!-- the near-black heart: lumpy, NOT a clean oval (bumps break the silhouette) -->
  <path d="M22 17
           C25.5 16 28.5 18.5 29 22
           C30.5 22.5 30.5 26 29 27.5
           C29.5 30.5 26 33 22 32
           C19.5 32.5 16 30 15.5 26.5
           C13.5 25 14 21 16 20
           C16.5 17.5 19 16.5 22 17Z"
        fill="#1c160e" fill-opacity="0.9"/>

  <!-- 4) a few CHAOTIC short scuff gouges — none crossing at the center -->
  <g stroke="#3a2c1e" stroke-linecap="round" fill="none" stroke-opacity="0.5">
    <path d="M16 19 L9 14" stroke-width="1.05"/>
    <path d="M30 19 L36.5 16.5" stroke-width="0.8"/>
    <path d="M28 30 L34 35.5" stroke-width="0.9"/>
    <path d="M17.5 30 L12 37" stroke-width="0.8"/>
  </g>

  <!-- 5) scattered debris flecks (#3a2c1e) thrown clear, lopsided cluster -->
  <g fill="#3a2c1e">
    <circle cx="6.5" cy="12" r="0.9"/>
    <circle cx="9" cy="41" r="1.0"/>
    <circle cx="5" cy="29" r="0.8"/>
    <circle cx="13.5" cy="43" r="0.8"/>
    <circle cx="40" cy="13" r="0.7"/>
    <circle cx="43.5" cy="26" r="0.7"/>
    <circle cx="37" cy="38" r="0.7"/>
    <circle cx="27" cy="43.5" r="0.6"/>
    <circle cx="15" cy="6.5" r="0.6"/>
    <circle cx="4" cy="20" r="0.7"/>
  </g>
  <!-- a couple of rust-tinted ejecta clods -->
  <g fill="#8a5a36" fill-opacity="0.85">
    <circle cx="44.5" cy="20" r="0.7"/>
    <circle cx="7" cy="36" r="0.8"/>
    <circle cx="20" cy="44" r="0.6"/>
    <circle cx="31" cy="6" r="0.6"/>
  </g>
</svg>
