<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- WALNUT / mulberry orchard tree, top-down. STATIC: round full broadleaf canopy.
       FIX: brighter NW lit crescent + stronger SE contact shadow so it POPS off the
       dark orchard/forest base. anchor [0.5,0.62], footprint 6 m. -->
  <defs>
    <radialGradient id="treeWalnut-canopy" cx="0.38" cy="0.34" r="0.74">
      <stop offset="0" stop-color="#7a9a52"/>
      <stop offset="0.5" stop-color="#527038"/>
      <stop offset="1" stop-color="#39532a"/>
    </radialGradient>
    <radialGradient id="treeWalnut-lit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#aecb7c"/>
      <stop offset="1" stop-color="#aecb7c" stop-opacity="0"/>
    </radialGradient>
    <filter id="treeWalnut-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="treeWalnut-softlit" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- SE cast shadow: stronger + tight dark core so the canopy lifts off the base -->
  <ellipse cx="27.5" cy="30.5" rx="15.5" ry="11" fill="#160f08" opacity="0.42" filter="url(#treeWalnut-soft)"/>
  <ellipse cx="27" cy="29.5" rx="9.5" ry="6.5" fill="#120c06" opacity="0.34" filter="url(#treeWalnut-soft)"/>

  <!-- full round lobed canopy -->
  <path d="M24 6
           q7 -1 11 4 q4 4 2.5 9 q1 6 -5 8.5 q-4 3 -9 1.5 q-6 1 -9.5 -4
           q-4 -4 -2 -9 q-1.5 -6 5 -8.5 q3.5 -2.5 7 -1.5z"
        fill="url(#treeWalnut-canopy)" stroke="#15100a" stroke-width="1.0" stroke-opacity="0.7"/>

  <!-- broad soft NW lit wash: brightens the whole upper-left hemisphere -->
  <ellipse cx="18.5" cy="14.5" rx="11" ry="10" fill="url(#treeWalnut-lit)" opacity="0.6" filter="url(#treeWalnut-softlit)"/>

  <!-- NW lit crescent: brighter + broader lit cap upper-left -->
  <path d="M24 6 q-7 0.5 -10.5 6 q-2.2 3.6 -1 7 q3.2 -5.6 8.4 -7.6 q3.8 -1.5 8 -1.4 q-1.7 -3.7 -4.9 -4z"
        fill="#92b463" opacity="0.92"/>
  <!-- inner bright lobe near the lit cap -->
  <ellipse cx="20.5" cy="13" rx="4.6" ry="3.6" fill="#a6c272" opacity="0.7"/>
  <!-- NW rim highlight (brightest edge) -->
  <path d="M15.5 11 q4.8 -4.2 10.2 -4" fill="none" stroke="#cfe2a0" stroke-width="1.1" stroke-opacity="0.85" stroke-linecap="round"/>

  <!-- leaf-clump lobes (a few deliberate blobs) -->
  <g opacity="0.5">
    <circle cx="20" cy="14" r="3.2" fill="#6a8a48"/>
    <circle cx="30" cy="16" r="3.4" fill="#476432"/>
    <circle cx="27" cy="25" r="3.6" fill="#39532a"/>
    <circle cx="18" cy="23" r="3.2" fill="#476432"/>
    <circle cx="24" cy="19" r="2.6" fill="#5e7e3e"/>
  </g>
  <!-- darker SE underside crescent (deepen shadow side) -->
  <path d="M32 27 q4.5 -2.5 5 -8 q1.4 5.6 -2 9.5 q-1.8 2 -3 -1.5z" fill="#28401f" opacity="0.6"/>
  <path d="M22 31 q5 1.6 10 -1.5 q-3 4 -9 3.4 q-1.6 -0.2 -1 -1.9z" fill="#28401f" opacity="0.4"/>
</svg>
