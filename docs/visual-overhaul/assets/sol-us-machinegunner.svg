<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US MACHINE GUNNER (M240), top-down, facing +x. ROTATING.
       The HEAVIEST figure: broadest shoulders, the biggest/longest barrel, a BIPOD at the
       muzzle, and a BELT of ammo hint feeding the receiver. -->
  <defs>
    <radialGradient id="solUsMg-helm" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#868a52"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#3c4028"/>
    </radialGradient>
    <linearGradient id="solUsMg-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#42452d"/>
    </linearGradient>
    <filter id="solUsMg-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (heaviest = biggest) -->
  <ellipse cx="24" cy="25.4" rx="12.5" ry="11.2" fill="#181308" opacity="0.32" filter="url(#solUsMg-soft)"/>

  <!-- broadest torso (heaviest figure): widest across y -->
  <path d="M17.2 14.4
           q-3.6 0.5 -3.6 9.2 q0 8.7 3.6 9.2
           q6.8 0.8 12.2 -1.6 q2.9 -1.3 2.9 -7.6 q0 -6.3 -2.9 -7.6 q-5.4 -2.4 -12.2 -1.6z"
        fill="url(#solUsMg-body)" stroke="#1c160e" stroke-width="1.0" stroke-opacity="0.6"/>
  <ellipse cx="18.8" cy="16.8" rx="3.9" ry="2.9" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="18.8" cy="31.2" rx="3.9" ry="2.9" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- AMMO BELT hint draped over the shoulder / feeding into the receiver -->
  <g stroke-linecap="round">
    <path d="M18 19 q5 1.6 9.6 5.8" fill="none" stroke="#8a6a3c" stroke-width="2.0"/>
    <!-- belt round ticks -->
    <path d="M20 19.7 l-0.7 1.2 M22.3 20.7 l-0.7 1.2 M24.5 22 l-0.7 1.2 M26.5 23.6 l-0.7 1.2"
          stroke="#5a3a1f" stroke-width="0.7"/>
  </g>

  <!-- arms gripping the big gun diagonally -->
  <path d="M21 18.6 q8 1.2 15.5 7" fill="none" stroke="#4d5132" stroke-width="3.3" stroke-linecap="round"/>
  <path d="M21.5 30 q7.5 -0.6 12.5 3" fill="none" stroke="#4d5132" stroke-width="3.2" stroke-linecap="round"/>

  <!-- weapon: M240 — biggest, longest, heaviest barrel diagonally low-ready -->
  <g stroke-linecap="round">
    <!-- receiver + barrel (thick) -->
    <line x1="18" y1="32" x2="44.5" y2="17.4" stroke="#1d1b15" stroke-width="3.1"/>
    <line x1="18" y1="32" x2="44.5" y2="17.4" stroke="#37352a" stroke-width="1.2"/>
    <!-- carry handle / feed cover block -->
    <rect x="28" y="22.4" width="5.4" height="3.4" rx="0.7" fill="#23211a" stroke="#0f0e0a" stroke-width="0.5"
          transform="rotate(-29 30.7 24.1)"/>
    <!-- ammo box / belt entry under receiver -->
    <rect x="24.6" y="27" width="4.2" height="3" rx="0.6" fill="#3a3420" stroke="#0f0e0a" stroke-width="0.5"
          transform="rotate(-29 26.7 28.5)"/>
    <!-- flash hider -->
    <circle cx="44.6" cy="17.3" r="1.2" fill="#141310"/>
    <!-- BIPOD splayed at the muzzle end -->
    <path d="M41 19.2 l-2.2 3 M41.9 19.7 l1.4 3.4" stroke="#1d1b15" stroke-width="1.0"/>
    <circle cx="38.6" cy="22.4" r="0.45" fill="#141310"/>
    <circle cx="43.4" cy="23.2" r="0.45" fill="#141310"/>
  </g>

  <!-- faction accent: US-blue IR flag on rear-left shoulder (bigger figure) -->
  <g transform="rotate(-22 17.5 17.5)">
    <rect x="14.8" y="15.6" width="5.6" height="3.2" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="15" y1="17.2" x2="20.2" y2="17.2" stroke="#cfe0f0" stroke-width="0.5" stroke-opacity="0.75"/>
  </g>

  <!-- helmet (ACH) — focal head, NW top-light + NVG mount at front -->
  <circle cx="25.2" cy="24" r="5.9" fill="url(#solUsMg-helm)" stroke="#1c160e" stroke-width="1.0"/>
  <path d="M20.8 20.4 a5.9 5.9 0 0 1 4.8 -2" fill="none" stroke="#cfd2a4" stroke-width="1.1" stroke-opacity="0.7" stroke-linecap="round"/>
  <rect x="30.4" y="22.8" width="2.6" height="2.4" rx="0.6" fill="#2b2920"/>
</svg>
