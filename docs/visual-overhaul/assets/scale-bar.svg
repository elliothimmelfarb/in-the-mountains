<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 20">
  <!-- scale-bar: map scale bar, alternating ink/dark segments + tick labels. FLAT, no shadow. anchor [0,0.5]. -->
  <defs>
    <filter id="scaleBar-halo" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- legibility halo under the bar -->
  <g filter="url(#scaleBar-halo)" opacity="0.5">
    <rect x="5.5" y="8.5" width="99" height="6" fill="#0c0d0a"/>
  </g>

  <!-- bar frame -->
  <rect x="6" y="9" width="98" height="6" fill="#14160f" stroke="#d8d6c4" stroke-width="1"/>
  <!-- 4 alternating segments (0-250-500 m) -->
  <rect x="6"    y="9" width="24.5" height="6" fill="#d8d6c4"/>
  <rect x="30.5" y="9" width="24.5" height="6" fill="#14160f"/>
  <rect x="55"   y="9" width="24.5" height="6" fill="#d8d6c4"/>
  <rect x="79.5" y="9" width="24.5" height="6" fill="#14160f"/>
  <!-- mid divider stroke -->
  <line x1="55" y1="9" x2="55" y2="15" stroke="#d8d6c4" stroke-width="1"/>

  <!-- tick risers at 0 / 250 / 500 -->
  <g stroke="#d8d6c4" stroke-width="1" stroke-linecap="round">
    <line x1="6"   y1="6.6" x2="6"   y2="15"/>
    <line x1="55"  y1="6.6" x2="55"  y2="15"/>
    <line x1="104" y1="6.6" x2="104" y2="15"/>
  </g>

  <!-- numeric tick labels: bold milspec stencil numerals (0 / 250 / 500) -->
  <g fill="#d8d6c4">
    <!-- 0 -->
    <path d="M6 1 a1.5 2.2 0 0 1 0 4.4 a1.5 2.2 0 0 1 0 -4.4 z M6 2.2 a0.7 1 0 0 0 0 1.9 a0.7 1 0 0 0 0 -1.9 z" transform="translate(-1.5 0)"/>
    <!-- 250 -->
    <g transform="translate(48 0.8)">
      <path d="M0.2 1.4 a1.3 1.3 0 0 1 2.5 0.2 q0 1 -2.4 2.6 h2.6 v0.9 h-3.4 v-0.8 q2.5 -1.7 2.4 -2.6 a0.5 0.5 0 0 0 -1.4 -0.1 z"/>
      <path d="M3.8 0.7 h2.4 v0.95 h-1.5 v0.9 q1.7 -0.15 1.7 1.35 a1.4 1.4 0 0 1 -2.5 0.85 l0.7 -0.6 a0.55 0.55 0 0 0 1 -0.35 q0 -0.7 -1.5 -0.45 v-2.65 z"/>
      <path d="M8.4 0.6 a1.5 2.3 0 0 1 0 4.5 a1.5 2.3 0 0 1 0 -4.5 z M8.4 1.55 a0.65 1.35 0 0 0 0 2.6 a0.65 1.35 0 0 0 0 -2.6 z"/>
    </g>
    <!-- 500 -->
    <g transform="translate(97 0.8)">
      <path d="M0.2 0.7 h2.5 v0.95 h-1.6 v0.85 q1.7 -0.15 1.7 1.35 a1.45 1.45 0 0 1 -2.55 0.85 l0.72 -0.6 a0.56 0.56 0 0 0 1.03 -0.35 q0 -0.72 -1.6 -0.42 v-2.7 z"/>
      <path d="M4.7 0.6 a1.5 2.3 0 0 1 0 4.5 a1.5 2.3 0 0 1 0 -4.5 z M4.7 1.55 a0.65 1.35 0 0 0 0 2.6 a0.65 1.35 0 0 0 0 -2.6 z"/>
      <path d="M8 0.6 a1.5 2.3 0 0 1 0 4.5 a1.5 2.3 0 0 1 0 -4.5 z M8 1.55 a0.65 1.35 0 0 0 0 2.6 a0.65 1.35 0 0 0 0 -2.6 z"/>
    </g>
  </g>

  <!-- unit tag 'm' on the right (amber accent) -->
  <g transform="translate(109 10.2)" fill="none" stroke="#e0a72b" stroke-width="0.85" stroke-linecap="round">
    <path d="M0 3 v-2.6 M0 0.9 q0.8 -0.6 1.4 0 q0.6 -0.6 1.4 0 M1.4 0.7 v2.3 M2.8 0.7 v2.3"/>
  </g>
</svg>
