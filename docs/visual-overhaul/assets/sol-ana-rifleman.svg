<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ANA RIFLEMAN, top-down, facing +x (east). ROTATING: symmetric contact shadow +
       rotation-tolerant top light. anchor [0.5,0.5], footprint 1.4 m.
       Distinct from US: woodland-mottled helmet (not plain OD), LIGHTER kit (thin chest rig),
       TEAL armband accent, AK-pattern rifle with curved banana magazine carried diagonally. -->
  <defs>
    <radialGradient id="solAnaRifleman-helm" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#8c8b5a"/>
      <stop offset="0.6" stop-color="#5a5b3a"/>
      <stop offset="1" stop-color="#3e402a"/>
    </radialGradient>
    <linearGradient id="solAnaRifleman-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#75793f"/>
      <stop offset="1" stop-color="#43472a"/>
    </linearGradient>
    <filter id="solAnaRifleman-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="25.2" rx="10.6" ry="9.6" fill="#181308" opacity="0.30" filter="url(#solAnaRifleman-soft)"/>

  <!-- shoulders / torso: WIDEST across y (perpendicular to facing) -->
  <path d="M18 16.8
           q-3 0.4 -3 7.2 q0 6.8 3 7.2
           q5.8 0.7 10.6 -1.3 q2.5 -1.1 2.5 -5.9 q0 -4.8 -2.5 -5.9 q-4.8 -2 -10.6 -1.3z"
        fill="url(#solAnaRifleman-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>

  <!-- thin/light chest rig hint (lighter than US plate carrier) -->
  <path d="M21.5 20.4 q3.2 3.6 0 7.2" fill="none" stroke="#3f4128" stroke-width="1.6" stroke-opacity="0.85"/>

  <!-- shoulder caps -->
  <ellipse cx="19.6" cy="18.7" rx="3.2" ry="2.4" fill="#62643f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19.6" cy="29.3" rx="3.2" ry="2.4" fill="#62643f" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- arms cradling the weapon diagonally across the front -->
  <path d="M21.5 19.8 q7 1.4 12 6.8" fill="none" stroke="#54562f" stroke-width="3.0" stroke-linecap="round"/>
  <path d="M22 28.6 q6.2 -0.6 10.4 2.8" fill="none" stroke="#54562f" stroke-width="2.9" stroke-linecap="round"/>

  <!-- weapon: AK carried diagonally (buttstock low-rear, muzzle high-front), CURVED banana mag -->
  <g stroke-linecap="round">
    <line x1="19.5" y1="30.4" x2="38.8" y2="20.2" stroke="#2a1f12" stroke-width="2.5"/>
    <line x1="19.5" y1="30.4" x2="38.8" y2="20.2" stroke="#5a3f24" stroke-width="0.9"/>
    <!-- curved banana magazine, sweeping forward of the body -->
    <path d="M26.6 28.7 q-1.4 3.6 1.4 5.6 q0.9 0.6 1.6 0.2" fill="none" stroke="#221d12" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="38.9" cy="20.1" r="0.95" fill="#141310"/> <!-- muzzle -->
  </g>

  <!-- faction accent: TEAL ANA armband on the rear shoulder -->
  <g transform="rotate(-20 18 19)">
    <rect x="15.4" y="17.2" width="5.4" height="3.2" rx="0.6" fill="#6fae9f" stroke="#1f3a33" stroke-width="0.45"/>
    <line x1="15.6" y1="18.8" x2="20.6" y2="18.8" stroke="#bfe2d9" stroke-width="0.5" stroke-opacity="0.8"/>
  </g>

  <!-- helmet — focal head, slightly forward. Woodland MOTTLE distinguishes from US. -->
  <circle cx="25.4" cy="24" r="5.6" fill="url(#solAnaRifleman-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <!-- camo blotches -->
  <path d="M23.4 21 q1.6 -0.5 2.4 0.9 q-1.1 1.2 -2.6 0.6 z" fill="#3f4126" fill-opacity="0.7"/>
  <path d="M26.6 25.2 q1.5 0.2 1.4 1.6 q-1.4 0.5 -2.1 -0.6 z" fill="#3f4126" fill-opacity="0.7"/>
  <path d="M23 25.6 q1.1 0.3 0.9 1.4 q-1.2 0.3 -1.6 -0.7 z" fill="#6a6c42" fill-opacity="0.6"/>
  <!-- TEAL helmet scrim band around the dome — rotation-invariant faction accent, reads at any angle -->
  <circle cx="25.4" cy="24" r="4.0" fill="none" stroke="#6fae9f" stroke-width="1.3" stroke-opacity="0.95"/>
  <!-- NW top-light crescent (over the band on the lit side) -->
  <path d="M21.4 20.7 a5.6 5.6 0 0 1 4.5 -1.8" fill="none" stroke="#d2d4a6" stroke-width="1.0" stroke-opacity="0.7" stroke-linecap="round"/>
</svg>
