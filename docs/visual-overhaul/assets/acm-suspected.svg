<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ACM SUSPECTED (ghost), top-down, facing +x. ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       UNCONFIRMED contact: the standard acm-fighter rendered semi-transparent (~0.5) inside a
       dashed red outline ring. Man-dress, turban, AK carried diagonally low-ready. NO helmet. -->
  <defs>
    <radialGradient id="acmSuspected-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#9a7e58"/>
      <stop offset="0.6" stop-color="#6e5a3c"/>
      <stop offset="1" stop-color="#4c3d28"/>
    </radialGradient>
    <linearGradient id="acmSuspected-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#94855f"/>
      <stop offset="1" stop-color="#67593f"/>
    </linearGradient>
    <filter id="acmSuspected-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- faint contact shadow (ghost is barely grounded) -->
  <ellipse cx="24" cy="25.2" rx="11" ry="9.5" fill="#181308" opacity="0.16" filter="url(#acmSuspected-soft)"/>

  <!-- the fighter itself, dimmed to ~0.5 -->
  <g opacity="0.5">
    <!-- AK carried diagonally (butt low-rear, barrel high-front) -->
    <g stroke-linecap="round">
      <line x1="18.5" y1="30.4" x2="39.5" y2="19.4" stroke="#171510" stroke-width="2.2"/>
      <line x1="18.5" y1="30.4" x2="39.5" y2="19.4" stroke="#34322a" stroke-width="0.9"/>
      <!-- curved AK magazine -->
      <path d="M27 28.6 q-0.4 -2.4 1.8 -4.2" fill="none" stroke="#1b1912" stroke-width="2.0"/>
      <circle cx="39.6" cy="19.3" r="0.9" fill="#121008"/>
    </g>

    <!-- torso/shoulders: widest across y -->
    <path d="M18.5 17.6 q-3.1 0.4 -3.1 6.4 q0 6 3.1 6.4
             q5.6 0.6 10.2 -1.3 q2.5 -1 2.5 -5.1 q0 -4.1 -2.5 -5.1 q-4.6 -1.9 -10.2 -1.3z"
          fill="url(#acmSuspected-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
    <ellipse cx="19.6" cy="19.3" rx="3.0" ry="2.3" fill="#79694b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.4"/>
    <ellipse cx="19.6" cy="28.7" rx="3.0" ry="2.3" fill="#79694b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- arms cradling the weapon -->
    <path d="M21.5 20.4 q7.5 1.4 13 6.0" fill="none" stroke="#76674a" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M22 27.6 q7 -0.4 11.5 2.6" fill="none" stroke="#76674a" stroke-width="2.7" stroke-linecap="round"/>

    <!-- red accent: scarf/armband -->
    <ellipse cx="19.4" cy="24" rx="2.0" ry="3.4" fill="#c0392b" stroke="#6e1c14" stroke-width="0.4"/>

    <!-- head: turban/pakol, focal, slightly forward, NW top light, NO helmet -->
    <circle cx="25.6" cy="24" r="4.9" fill="url(#acmSuspected-head)" stroke="#1c160e" stroke-width="0.9"/>
    <path d="M22.0 21.0 a4.9 4.9 0 0 1 3.6 -1.5" fill="none" stroke="#c8b68e" stroke-width="0.95" stroke-opacity="0.65" stroke-linecap="round"/>
    <circle cx="25.6" cy="24" r="4.9" fill="none" stroke="#5a4a30" stroke-width="1.0" stroke-opacity="0.5"/>
  </g>

  <!-- UNCONFIRMED: dashed red outline ring (drawn at full opacity so the status reads clearly) -->
  <circle cx="24" cy="24" r="13.4" fill="none" stroke="#c0392b" stroke-width="1.3"
          stroke-dasharray="3.2 2.6" stroke-opacity="0.9"/>
  <circle cx="24" cy="24" r="13.4" fill="none" stroke="#5a1610" stroke-width="2.0"
          stroke-dasharray="3.2 2.6" stroke-opacity="0.25"/>
</svg>
