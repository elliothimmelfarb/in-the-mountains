<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- ico-cerp-footbridge: planks + rails spanning a gap. -->
  <g fill="none" stroke="#d8d6c4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- deck (planks) - slight catenary span -->
    <path d="M2.6 13 C8 11.4 16 11.4 21.4 13"/>
    <path d="M2.6 15.4 C8 13.8 16 13.8 21.4 15.4"/>
    <!-- handrail top -->
    <path d="M2.6 8.6 C8 7.4 16 7.4 21.4 8.6"/>
    <!-- balusters / posts -->
    <path d="M4.4 8.2 L4.4 14.6 M8 7.5 L8 13.6 M12 7.4 L12 13.4 M16 7.5 L16 13.6 M19.6 8.2 L19.6 14.6"/>
  </g>
  <!-- bank anchors (amber active accent) -->
  <path d="M2.6 13 L2.6 17.4 M21.4 13 L21.4 17.4" stroke="#e0a72b" stroke-width="1.6" stroke-linecap="round"/>
</svg>
