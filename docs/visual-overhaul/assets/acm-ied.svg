<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- ACM IED EMPLACER, top-down, facing +x. ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       KNEELING/crouched over a small device + wires on the ground in front of him.
       Compact, low silhouette, tense. Distinct from the standing figures. Red accent. -->
  <defs>
    <radialGradient id="acmIed-head" cx="0.4" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#9a7e58"/>
      <stop offset="0.6" stop-color="#6e5a3c"/>
      <stop offset="1" stop-color="#4c3d28"/>
    </radialGradient>
    <radialGradient id="acmIed-body" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#9a8a64"/>
      <stop offset="1" stop-color="#615639"/>
    </radialGradient>
    <filter id="acmIed-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (compact crouch) -->
  <ellipse cx="23.5" cy="25" rx="10" ry="8.5" fill="#181308" opacity="0.32" filter="url(#acmIed-soft)"/>

  <!-- the device on the ground in front (east of the figure): jug + wires -->
  <ellipse cx="37.5" cy="24" rx="3.4" ry="3.0" fill="#7a6a4a" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.7"/>
  <path d="M37.5 21.0 a3.4 3.0 0 0 1 2.4 0.9" fill="none" stroke="#cdbb90" stroke-width="0.7" stroke-opacity="0.6"/>
  <!-- detonator / cap -->
  <rect x="35.8" y="22.6" width="2.2" height="1.4" rx="0.4" fill="#3a3024" stroke="#13110d" stroke-width="0.4"/>
  <!-- wires running from device back toward the figure's hands -->
  <path d="M34.6 24.2 q-4 1.2 -6.4 1.6" fill="none" stroke="#b5532a" stroke-width="0.7"/>
  <path d="M34.6 23.0 q-4 -0.6 -6.4 -0.4" fill="none" stroke="#2a2c22" stroke-width="0.7"/>

  <!-- crouched torso: foreshortened, hunched forward/east — compact blob -->
  <path d="M18 19.5 q-3.4 0.6 -3.4 4.5 q0 3.9 3.4 4.5
           q6.2 1.0 11.4 -1.0 q2.4 -0.9 2.4 -3.5 q0 -2.6 -2.4 -3.5 q-5.2 -2.0 -11.4 -1.0z"
        fill="url(#acmIed-body)" stroke="#1c160e" stroke-width="0.9" stroke-opacity="0.6"/>
  <!-- hunched back highlight (NW top light) -->
  <path d="M18.5 20.8 q5.6 -1.0 10.8 0.4" fill="none" stroke="#c9b78c" stroke-width="0.9" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- both arms reaching DOWN/forward to the device (low, working) -->
  <path d="M24 21.5 q5 0.4 9 2.3" fill="none" stroke="#6f6244" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M24 26.5 q5 -0.4 9 -2.0" fill="none" stroke="#6f6244" stroke-width="2.6" stroke-linecap="round"/>
  <!-- hands at the device -->
  <circle cx="33.4" cy="24.0" r="1.5" fill="#86714f" stroke="#1c160e" stroke-width="0.4"/>

  <!-- faction accent: red armband on the reaching arm -->
  <path d="M27.4 21.9 q1.8 0.4 3.4 1.2" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-linecap="round"/>

  <!-- head: bent forward & down over the work, low between shoulders -->
  <circle cx="22.6" cy="24" r="4.3" fill="url(#acmIed-head)" stroke="#1c160e" stroke-width="0.9"/>
  <path d="M19.3 21.4 a4.3 4.3 0 0 1 3.3 -1.3" fill="none" stroke="#c8b68e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
  <circle cx="22.6" cy="24" r="4.3" fill="none" stroke="#5a4a30" stroke-width="1.0" stroke-opacity="0.5"/>
</svg>
