<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 18">
  <!-- coordinate-tab: grid-coordinate readout tab. stencil-edged dark tab, amber stencil corners. FLAT. anchor [0,0.5]. -->
  <defs>
    <linearGradient id="coordTab-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181a12"/>
      <stop offset="1" stop-color="#101209"/>
    </linearGradient>
  </defs>

  <!-- tab body with clipped (stencil) corners -->
  <path d="M4 2 H66 L68 4 V14 L66 16 H4 L2 14 V4 Z"
        fill="url(#coordTab-body)" stroke="#2c3022" stroke-width="1"/>
  <!-- inner keyline -->
  <path d="M4.6 3.2 H65.4 L66.8 4.6 V13.4 L65.4 14.8 H4.6 L3.2 13.4 V4.6 Z"
        fill="none" stroke="#0c0d0a" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- amber stencil corner ticks -->
  <g stroke="#e0a72b" stroke-width="1.2" stroke-linecap="round">
    <path d="M4 4.4 L4 2.4 L6 2.4" fill="none"/>
    <path d="M66 2.4 L68 4.4" fill="none"/>
    <path d="M68 13.6 L66 15.6" fill="none"/>
    <path d="M6 15.6 L4 15.6 L4 13.6" fill="none"/>
  </g>

  <!-- leading 'GR' label tag (amber) so the tab reads as a grid reference -->
  <g transform="translate(7 5.2)" fill="none" stroke="#e0a72b" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 0.4 a1.6 1.7 0 1 0 0 6.6 q0.9 0 1.6 -0.4 V4 H3.2"/>
    <path d="M6.6 7 V0.4 h2 a1.4 1.4 0 0 1 0 2.8 h-2 M8 3.2 l1.6 3.8"/>
  </g>

  <!-- separator + readout baseline rule (renderer overlays the numerals) -->
  <line x1="19" y1="11.6" x2="63" y2="11.6" stroke="#9a9a82" stroke-width="0.6" stroke-opacity="0.45"/>
  <line x1="40" y1="5" x2="40" y2="13" stroke="#2c3022" stroke-width="0.8"/>
</svg>
