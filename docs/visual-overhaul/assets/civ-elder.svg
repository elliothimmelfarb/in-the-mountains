<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- CIV ELDER: dignified, lighter robe, white prayer cap, white beard hint, walking staff.
       Top-down, facing +x. ROTATING: symmetric contact shadow + gentle top light.
       Broad settled stance; staff planted forward at the side. -->
  <defs>
    <radialGradient id="civElder-cap" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ece4cf"/>
      <stop offset="0.7" stop-color="#cfc6ad"/>
      <stop offset="1" stop-color="#a89e83"/>
    </radialGradient>
    <radialGradient id="civElder-robe" cx="0.34" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#cabf9f"/>
      <stop offset="0.7" stop-color="#a59c7d"/>
      <stop offset="1" stop-color="#827a5f"/>
    </radialGradient>
    <filter id="civElder-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (broad — dignified, settled) -->
  <ellipse cx="24" cy="24.8" rx="10" ry="9" fill="#181308" opacity="0.30" filter="url(#civElder-soft)"/>

  <!-- arms: one to planted staff (forward-low), one relaxed -->
  <path d="M22 28.6 q5.4 0.2 8.6 1.6" fill="none" stroke="#a39873" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M22 19.4 q5.2 -0.2 8.2 1.4" fill="none" stroke="#a39873" stroke-width="2.7" stroke-linecap="round"/>

  <!-- lighter robe / torso: broad oval, draped, widest across y -->
  <ellipse cx="22.2" cy="24" rx="7.3" ry="8.4" fill="url(#civElder-robe)" stroke="#241c12" stroke-width="0.85" stroke-opacity="0.6"/>
  <!-- shawl fold highlight + center seam -->
  <path d="M18.2 19.2 a7.3 8.4 0 0 0 -2.4 4.8" fill="none" stroke="#e6dcc0" stroke-width="0.95" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M22.2 15.8 q-1 8.2 0 16.4" fill="none" stroke="#776e54" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- WALKING STAFF: near-vertical, planted forward-right, gnarled wood -->
  <line x1="32.6" y1="14.6" x2="31.4" y2="32.4" stroke="#5a4226" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32.6" y1="14.6" x2="31.4" y2="32.4" stroke="#83633b" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="32.6" cy="14.6" r="1.2" fill="#6a4e2c"/> <!-- worn grip knob -->
  <circle cx="31.5" cy="26.2" r="1.1" fill="#a87f55"/> <!-- hand on staff -->

  <!-- head: WHITE prayer cap (focal), forward (+x), beard hint toward front -->
  <circle cx="26.6" cy="24" r="4.6" fill="url(#civElder-cap)" stroke="#241c12" stroke-width="0.9"/>
  <circle cx="26.6" cy="24" r="2.9" fill="none" stroke="#9a906f" stroke-width="0.6" stroke-opacity="0.55"/>
  <!-- white beard hint spilling toward the front (+x) -->
  <path d="M30.4 22.4 q2.2 1.6 0 3.2 q-1.3 0.8 -2.9 0.3" fill="#e4dcc4" opacity="0.85"/>
  <!-- NW highlight on cap -->
  <path d="M23.4 21.4 a4.6 4.6 0 0 1 3 -1.4" fill="none" stroke="#f1ead4" stroke-width="0.9" stroke-opacity="0.7" stroke-linecap="round"/>
</svg>
