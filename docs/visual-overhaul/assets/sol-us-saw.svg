<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- US SAW GUNNER (M249), top-down, facing +x. ROTATING. anchor [0.5,0.5], footprint 1.4 m.
       Based on sol-us-rifleman: same helmet/shadow/anchor. Role cues: bulkier gunner,
       LONGER heavier barrel, BIPOD at the muzzle, box/drum magazine slung under. -->
  <defs>
    <radialGradient id="solUsSaw-helm" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#868a52"/>
      <stop offset="0.6" stop-color="#565b39"/>
      <stop offset="1" stop-color="#3c4028"/>
    </radialGradient>
    <linearGradient id="solUsSaw-body" x1="0.25" y1="0.05" x2="0.7" y2="1">
      <stop offset="0" stop-color="#727650"/>
      <stop offset="1" stop-color="#454830"/>
    </linearGradient>
    <filter id="solUsSaw-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow (bulkier) -->
  <ellipse cx="24" cy="25.2" rx="12.5" ry="10.6" fill="#181308" opacity="0.31" filter="url(#solUsSaw-soft)"/>

  <!-- shoulders / torso: BULKIER than rifleman -->
  <path d="M17.4 15.4
           q-3.7 0.4 -3.7 8.6 q0 8.2 3.7 8.6
           q6.5 0.8 12 -1.6 q3 -1.3 3 -7 q0 -5.7 -3 -7 q-5.5 -2.4 -12 -1.6z"
        fill="url(#solUsSaw-body)" stroke="#1c160e" stroke-width="0.95" stroke-opacity="0.6"/>
  <!-- shoulder caps -->
  <ellipse cx="19" cy="17.4" rx="3.7" ry="2.7" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>
  <ellipse cx="19" cy="30.6" rx="3.7" ry="2.7" fill="#5b5f3b" stroke="#1c160e" stroke-width="0.5" stroke-opacity="0.45"/>

  <!-- arms cradling the heavy weapon diagonally -->
  <path d="M21 19.2 q7.5 1.6 13.5 7.6" fill="none" stroke="#4d5132" stroke-width="3.3" stroke-linecap="round"/>
  <path d="M21.5 29.6 q7 -0.6 11.5 3.2" fill="none" stroke="#4d5132" stroke-width="3.2" stroke-linecap="round"/>

  <!-- box/drum ammo magazine slung under the receiver -->
  <rect x="25.4" y="26.2" width="5.4" height="4.6" rx="1.0" fill="#3b4a32" stroke="#1c160e" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="26.2" y1="27.6" x2="30" y2="27.6" stroke="#566a44" stroke-width="0.5" stroke-opacity="0.7"/>
  <line x1="26.2" y1="29.2" x2="30" y2="29.2" stroke="#566a44" stroke-width="0.5" stroke-opacity="0.7"/>

  <!-- weapon: M249 — LONGER, heavier barrel, reaching further out than the M4 -->
  <g stroke-linecap="round">
    <line x1="18.5" y1="31.5" x2="43.5" y2="18.5" stroke="#1d1b15" stroke-width="3.0"/>
    <line x1="18.5" y1="31.5" x2="43.5" y2="18.5" stroke="#3a382c" stroke-width="1.1"/>
    <!-- heat-shield / barrel ridges -->
    <line x1="33" y1="26.8" x2="40.5" y2="22.9" stroke="#15140f" stroke-width="3.6"/>
    <line x1="34" y1="26.0" x2="40.5" y2="22.6" stroke="#464436" stroke-width="0.7" stroke-opacity="0.7"/>
    <circle cx="43.6" cy="18.4" r="1.1" fill="#141310"/> <!-- muzzle -->
  </g>
  <!-- BIPOD at the muzzle (two splayed legs) -->
  <g stroke="#201e17" stroke-width="1.0" stroke-linecap="round">
    <line x1="40.6" y1="22.7" x2="44.6" y2="24.4"/>
    <line x1="40.6" y1="22.7" x2="43.6" y2="26.6"/>
  </g>

  <!-- faction accent: US-blue IR flag on the rear-left shoulder + nav stripe -->
  <g transform="rotate(-22 17.5 18)">
    <rect x="14.8" y="16.2" width="5.4" height="3.1" rx="0.5" fill="#4a86c6" stroke="#1b2a3a" stroke-width="0.4"/>
    <line x1="15" y1="17.75" x2="20" y2="17.75" stroke="#cfe0f0" stroke-width="0.5" stroke-opacity="0.75"/>
  </g>

  <!-- helmet (ACH) — focal head, NW top-light + NVG mount front -->
  <circle cx="25.2" cy="24" r="5.9" fill="url(#solUsSaw-helm)" stroke="#1c160e" stroke-width="0.95"/>
  <path d="M20.8 20.4 a5.9 5.9 0 0 1 4.8 -2" fill="none" stroke="#cfd2a4" stroke-width="1.05" stroke-opacity="0.7" stroke-linecap="round"/>
  <rect x="30.3" y="22.9" width="2.5" height="2.3" rx="0.6" fill="#2b2920"/>
</svg>
