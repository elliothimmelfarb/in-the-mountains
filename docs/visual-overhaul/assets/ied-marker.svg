<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- ied-marker: IED / explosive-hazard. Triangular hazard with a blast/charge
       symbol, rust. anchor [0.5,0.5], screen-fixed. -->
  <defs>
    <linearGradient id="ied-tri" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#c66a3e"/>
      <stop offset="1" stop-color="#9c4622"/>
    </linearGradient>
  </defs>

  <!-- dark keyline halo behind the triangle for legibility over terrain -->
  <path d="M18 3.4 L34 31.4 L2 31.4 Z" fill="#0c0d0a" opacity="0.5"/>

  <!-- hazard triangle, rust -->
  <path d="M18 4.4 L33 31 L3 31 Z" fill="url(#ied-tri)" stroke="#1c160e" stroke-width="1.2" stroke-opacity="0.7" stroke-linejoin="round"/>
  <!-- NW lit edge -->
  <path d="M18 4.4 L3 31" fill="none" stroke="#e89a6e" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- inner amber warning border -->
  <path d="M18 9 L29.6 29.5 L6.4 29.5 Z" fill="none" stroke="#e0a72b" stroke-width="1.3" stroke-opacity="0.85" stroke-linejoin="round"/>

  <!-- charge / blast symbol: a bold charge block with a radiating blast spark -->
  <!-- charge body -->
  <rect x="14.7" y="20.6" width="6.6" height="5.2" rx="0.6" fill="#2a2114" stroke="#f3ecd6" stroke-width="0.9" stroke-opacity="0.9"/>
  <!-- detonator wire -->
  <path d="M18 20.6 L18 17.4" fill="none" stroke="#1c160e" stroke-width="1.1" stroke-linecap="round"/>
  <!-- blast spark above (radiating, bold) -->
  <g stroke="#f3ecd6" stroke-width="1.3" stroke-linecap="round">
    <line x1="18" y1="16.8" x2="18" y2="12.8"/>
    <line x1="18" y1="15.0" x2="14.4" y2="12.4"/>
    <line x1="18" y1="15.0" x2="21.6" y2="12.4"/>
  </g>
  <circle cx="18" cy="16.6" r="1.3" fill="#e0a72b" stroke="#1c160e" stroke-width="0.4" stroke-opacity="0.5"/>
</svg>
