<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- DONKEY: top-down pack animal (footprint ~1.4 m), grey body with loaded panniers.
       Facing +x (head forward). ROTATING: symmetric contact shadow + gentle top light.
       Body elongated along x; tan/canvas panniers slung over the back. -->
  <defs>
    <radialGradient id="donkey-body" cx="0.4" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#a8a496"/>
      <stop offset="0.6" stop-color="#827e70"/>
      <stop offset="1" stop-color="#5c594e"/>
    </radialGradient>
    <linearGradient id="donkey-load" x1="0.2" y1="0.1" x2="0.7" y2="1">
      <stop offset="0" stop-color="#b3a785"/>
      <stop offset="1" stop-color="#7e7252"/>
    </linearGradient>
    <filter id="donkey-soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.0"/>
    </filter>
  </defs>

  <!-- symmetric contact shadow -->
  <ellipse cx="24" cy="24.8" rx="10" ry="5.6" fill="#181308" opacity="0.30" filter="url(#donkey-soft)"/>

  <!-- four legs at corners -->
  <circle cx="19.6" cy="20.6" r="1.15" fill="#4c483d"/>
  <circle cx="19.6" cy="27.4" r="1.15" fill="#4c483d"/>
  <circle cx="28.4" cy="20.8" r="1.1" fill="#4c483d"/>
  <circle cx="28.4" cy="27.2" r="1.1" fill="#4c483d"/>

  <!-- body: long oval along x (the spine) -->
  <ellipse cx="23" cy="24" rx="9" ry="4.8" fill="url(#donkey-body)" stroke="#241c12" stroke-width="0.85" stroke-opacity="0.6"/>
  <!-- NW back highlight -->
  <path d="M16.4 21.4 q6 -1.4 12.4 -0.4" fill="none" stroke="#cdc9ba" stroke-width="0.85" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- PANNIERS: two canvas loads slung over the back, one each side of the spine -->
  <rect x="18" y="17.6" width="9.5" height="4" rx="1.2" fill="url(#donkey-load)" stroke="#241c12" stroke-width="0.7" stroke-opacity="0.55"/>
  <rect x="18" y="26.4" width="9.5" height="4" rx="1.2" fill="url(#donkey-load)" stroke="#241c12" stroke-width="0.7" stroke-opacity="0.55"/>
  <!-- lash strap across the spine + load top highlight -->
  <line x1="22.6" y1="17.4" x2="22.6" y2="30.6" stroke="#5a503a" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="18.6" y1="18.4" x2="26.8" y2="18.4" stroke="#d6cba6" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- tail at the rear (-x) -->
  <path d="M14 24 q-2.4 -0.4 -3 1" fill="none" stroke="#5c594e" stroke-width="1.3" stroke-linecap="round"/>

  <!-- neck + head forward (+x) -->
  <path d="M31.4 24 q2.6 -0.3 4.2 -0.2" fill="none" stroke="#86826f" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="37" cy="23.8" rx="3" ry="2.2" fill="url(#donkey-body)" stroke="#241c12" stroke-width="0.8"/>
  <!-- two long ears swept back -->
  <path d="M35.6 21.6 q-1.4 -2.4 -3.4 -3" fill="none" stroke="#7e7a6a" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M36 26 q-1.2 2.4 -3.2 3" fill="none" stroke="#7e7a6a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="39.4" cy="23.9" rx="1.1" ry="0.95" fill="#4c483d"/>
</svg>
